<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人员字段配置 · PRD</title>
<!--
  单模块 PRD 模板（system-to-prd / 模式 A）
  数据来自 window.PRD_DATA，结构见 references/doc-8sections.md
  生成器：scripts/build_module_prd.py
-->
<style>

:root{
  --blue:#1E6FD9; --blue-l:#EAF2FD; --deep:#0B2E4E; --txt:#3A4A5C; --sub:#7A8A9C;
  --line:#E6EDF5; --bg:#F7FAFD; --red:#D93025; --amber:#C77700; --green:#1B7F45;
  --purple:#6B46C1; --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:var(--txt);background:#fff;font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .r1{display:flex;align-items:center;gap:14px;padding:11px 22px}
.dot{width:18px;height:18px;border-radius:50%;
  background:conic-gradient(from 200deg,#37B6E9,#1E6FD9,#20C4A6,#37B6E9);flex:0 0 auto}
.top b{font-size:14px;color:var(--deep);font-weight:700;letter-spacing:.2px}
.top .tag{font-size:10.5px;color:#fff;background:var(--amber);padding:1px 7px;border-radius:4px;font-weight:600}
.top .crumb{font-size:12px;color:var(--sub)}
.top .crumb i{font-style:normal;color:#C3D0DE;margin:0 5px}
.sp{flex:1}
.modes{display:flex;gap:3px;background:#F1F5FA;padding:3px;border-radius:9px}
.modes button{border:0;background:transparent;font-family:inherit;font-size:12.5px;color:#5C6F84;
  padding:6px 14px;border-radius:7px;cursor:pointer;transition:.15s}
.modes button:hover{color:var(--blue)}
.modes button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 4px rgba(30,111,217,.16)}
.top .r2{display:flex;align-items:center;gap:10px;padding:8px 22px 10px;
  border-top:1px dashed #EDF3F9;font-size:12px;color:#6E8298;background:#FCFDFF}
.top .r2 b{color:#1B4A7E;font-size:12px}

/* ---------- 舞台 ---------- */
.stage{display:flex;align-items:stretch;height:calc(100vh - var(--topH,96px));position:relative}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.pane.hide{display:none}
/* 每个 pane 自己固定头 + 内部滚动，四视图行为一致 */
.pane-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pane.ai{background:#0F1724;border-left:1px solid #0B1220}
.pane-hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:9px 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--sub);z-index:5}
.pane.ai .pane-hd{background:rgba(15,23,36,.96);border-bottom-color:#1E2A3D;color:#7C90A8}
.pane-hd .k{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--blue);
  padding:1.5px 7px;border-radius:4px;font-weight:600;letter-spacing:.3px}
.pane.ai .pane-hd .k{background:#3B7DD8}
/* 单视图时栏头与正文左边界对齐（正文 820 居中，padding 30） */
body:not(.both) .pane.human .pane-hd{padding-left:calc(50% - 380px);padding-right:calc(50% - 380px)}
/* 单视图下顶部提示条已经说明当前视图，栏头对叙事/AI/核查是重复信息；原型栏头有帧名与缩放，保留 */
body:not(.both) .pane.human .pane-hd,
body:not(.both) .pane.ai .pane-hd,
body:not(.both) .pane.facts .pane-hd{display:none}
@media (max-width:920px){
  body:not(.both) .pane.human .pane-hd{padding-left:22px;padding-right:22px}
}

/* ---------- 人读视图 ---------- */
.doc{padding:26px 30px 90px;max-width:820px;margin:0 auto}
.doc h1{font-size:21px;line-height:1.35;font-weight:700;color:var(--deep);
  padding-bottom:12px;border-bottom:1.5px solid #E6EEF7;margin-bottom:6px}
.doc .meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 22px}
.doc .meta span{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600}
.m-b1{background:#EAF7EE;color:#1B7F45}
.m-b2{background:#EAF2FD;color:#1E6FD9}
.m-b3{background:#F3EEFB;color:#6B46C1}
.m-b4{background:#FFF6E8;color:#B45309}
.m-gray{background:#F1F5FA;color:#5C6F84}

.doc h2{font-size:15px;font-weight:700;color:#16324F;margin:30px 0 12px;
  padding-left:11px;position:relative}
.doc h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;
  border-radius:2px;background:var(--blue)}
.doc h2 em{font-style:normal;font-size:11px;font-weight:500;color:#9AAABA;margin-left:8px}
/* 段标题右侧的「这一段对应哪几屏」按钮：1234 直接点，不用回左边自己找 */
.doc h2 .figjump{float:right;display:inline-flex;align-items:center;gap:4px;
  margin-top:-1px;font-weight:400}
.doc h2 .figjump i{font-style:normal;font-size:10px;color:#9AAABA;letter-spacing:.04em}
.doc h2 .figjump .fj{font:inherit;font-size:10.5px;font-weight:600;line-height:1;
  padding:3px 8px;border:1px solid #C9DAEC;background:#F5F9FD;color:#346FC5;
  border-radius:9px;cursor:pointer}
.doc h2 .figjump .fj:hover{background:#E7F1FC;border-color:#9CC3EE;color:#185FA5}
.doc h3{font-size:13.5px;font-weight:700;color:#3D5B7A;margin:20px 0 9px}
.doc p{margin:0 0 12px;line-height:1.9}
.doc b{color:var(--deep);font-weight:700}
.doc ul,.doc ol{margin:0 0 13px;padding-left:20px}
.doc li{margin:0 0 7px;line-height:1.85}
.doc li::marker{color:#8FA9C4}
.doc code{font-family:var(--mono);font-size:12px;background:#F1F6FC;color:#1E5B9B;
  padding:1.5px 5px;border-radius:4px;border:1px solid #E2ECF7;white-space:nowrap}
/* 表格里的 code 允许折行：table-layout:fixed 下 nowrap 会溢出到相邻列，被后一列盖住半截（2026-11-03 踩过） */
.doc td code,.doc th code,.doc li code{white-space:normal;word-break:break-word;overflow-wrap:anywhere}

.callout{background:#F2F8FF;border-left:3px solid #7FB3EE;padding:13px 16px;
  border-radius:0 8px 8px 0;margin:0 0 16px;color:#22486F;line-height:1.85}
.callout.warn{background:#FFFCF5;border-left-color:#E9B44C;color:#6B4A12}
.callout.key{background:#F7FAFF;border-left-color:#4A90E2}
.callout b{color:inherit}


/* 证据来源矩阵 */
.evm{border:1px solid #E1EBF6;border-radius:10px;margin:0 0 18px;overflow:hidden;background:#fff}
.evm-h{padding:10px 14px;background:#F4F8FD;font-size:12.5px;font-weight:700;color:#1B3550;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evm-h em{font-style:normal;font-size:11px;font-weight:400;color:#8FA3B8}
.evm-list{display:grid;grid-template-columns:1fr 1fr}
.ev{display:flex;align-items:baseline;gap:8px;padding:9px 14px;
  border-top:1px solid #F0F5FA;font-size:11.5px;line-height:1.6}
.ev:nth-child(odd){border-right:1px solid #F0F5FA}
.ev-k{flex:0 0 66px;font-weight:700;color:#3D5B7A}
.ev b{font-size:10px;padding:1px 5px;border-radius:3px;flex:0 0 auto;font-weight:600}
.ev-ok{background:#EAF7EE;color:#1B7F45}
.ev-part{background:#FFF6E8;color:#B45309}
.ev-no{background:#F1F5FA;color:#93A5B8}
.ev-d{flex:1;min-width:0;color:#6E8298}
/* 规则卡上的来源微标 */
.src{font-size:10px;padding:1px 6px;border-radius:4px;background:#F7FAFD;
  color:#6E8298;border:1px solid #E3EAF3}

/* 场景卡 */
.scn{border:1px solid #E6EDF5;border-radius:9px;padding:12px 15px;margin:0 0 11px;background:#FCFDFF}
.scn:hover{border-color:#D5E3F2;background:#FBFDFF}
.scn-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;
  color:#16324F;margin-bottom:8px}
.scn-k{width:20px;height:20px;border-radius:50%;background:#1E6FD9;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);flex:0 0 auto}
.scn-r{display:flex;gap:9px;font-size:12.5px;line-height:1.8;margin:4px 0}
.scn-r>b{flex:0 0 34px;font-size:11px;color:#7C93AC;font-weight:600;padding-top:2px}
.scn-r>div{flex:1;min-width:0;color:#3D4E60}
.note-line{font-size:11.5px;color:#9AAABA;border-top:1px dashed #E6EDF7;
  padding-top:9px;margin-top:16px}

/* 表格 */
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid #E6EEF7;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th{background:#F3F8FD;color:#3D5B7A;font-weight:700;text-align:left;padding:10px 12px;
  font-size:12px;border-bottom:1.5px solid #E1EBF6;line-height:1.5}
td{padding:10px 12px;border-bottom:1px solid #EEF4FA;vertical-align:top;line-height:1.75}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFCFF}
td.mono,th.mono{font-family:var(--mono);font-size:11.5px;color:#2C5C8F}
td.c{text-align:center}

/* 流程图：2×2 网格，四步横排会挤成一条线 */
.flow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.fstep{background:#FAFCFF;border:1px solid #E1EBF6;border-radius:9px;padding:12px 14px}
.fstep .n{font-family:var(--mono);font-size:10px;color:#fff;background:#8FB3D9;
  display:inline-block;padding:0 6px;border-radius:3px;line-height:16px;margin-bottom:7px}
.fstep .t{font-size:13px;font-weight:700;color:#16324F;margin-bottom:5px}
.fstep .d{font-size:11.5px;color:#6E8298;line-height:1.7}

/* 规则卡 */
.rule{border:1px solid #E6EDF5;border-left:3px solid var(--rc,#1E6FD9);border-radius:0 9px 9px 0;
  padding:14px 16px;margin:0 0 13px;background:#fff}
.rule:hover{box-shadow:0 3px 16px rgba(24,64,120,.07)}
.rule .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rid{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--rc,#1E6FD9);
  padding:1.5px 7px;border-radius:4px;cursor:pointer;border:0;font-family:var(--mono)}
.rid:hover{opacity:.85}
.rtype{font-size:10.5px;padding:1px 7px;border-radius:4px;background:#F1F5FA;color:#5C6F84;
  border:1px solid #E3EAF3}
.rconf{font-size:10.5px;padding:1px 7px;border-radius:4px;font-weight:600}
.rule .st{font-size:13.5px;line-height:1.8;color:#22405C;font-weight:500}
.rule .st b{color:var(--deep)}
.rule .ev{margin-top:8px;font-family:var(--mono);font-size:11px;color:#7C93AC;
  background:#FAFCFF;border:1px dashed #DCE8F5;border-radius:5px;padding:5px 9px;
  word-break:break-all}
.cases{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.case{display:flex;gap:9px;font-size:12px;line-height:1.75;padding:7px 10px;
  border-radius:6px;border-left:2px solid var(--cc);background:var(--cb)}
.case .ck{flex:0 0 auto;font-size:10px;font-weight:700;color:#fff;background:var(--cc);
  padding:0 6px;border-radius:3px;line-height:16px;height:16px;margin-top:2px}
.case .cb{flex:1;min-width:0}
.case .cb b{font-weight:600;color:#2C4A66}
.c-pos{--cc:#1B7F45;--cb:#F5FBF7}
.c-neg{--cc:#D93025;--cb:#FEF6F5}
.c-edge{--cc:#C77700;--cb:#FFFCF5}

/* 状态机 */
.sm{background:#FAFCFF;border:1px solid #E6EEF7;border-radius:10px;padding:8px 4px 2px;
  margin-bottom:10px;overflow-x:auto}
.sm svg{display:block;width:100%;min-width:640px;height:auto}

.sm text.lb{paint-order:stroke;stroke:#FAFCFF;stroke-width:3px;stroke-linejoin:round}
.smcap{font-size:11px;color:#9AAABA;padding:6px 14px 8px;line-height:1.6}

/* AI 视图 */
.ai-body{padding:0 0 80px}
.jsonl{padding:0 20px}
.jline{display:flex;gap:0;font-family:var(--mono);font-size:11.5px;line-height:1.85;
  padding:9px 12px;border-radius:6px;margin:0 0 3px;color:#C6D4E4;
  border:1px solid transparent;transition:.18s}
.jline:hover{background:#141F30}
.jline.hit{background:#1C2E47;border-color:#3B7DD8;box-shadow:0 0 0 1px #3B7DD8}
.jline .no{flex:0 0 30px;color:#43566E;text-align:right;padding-right:10px;user-select:none}
.jline .code{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.jk{color:#7CC0F8}   /* key */
.jstr{color:#A8D08D} /* string */
.jnum{color:#E5C07B}
.jbool{color:#C792EA}
.jid{color:#FF9E64;font-weight:600}
.jcm{color:#5F7288;font-style:italic}
.jsec{padding:14px 20px 8px;font-size:11px;letter-spacing:1.2px;color:#6C8FB8;
  font-weight:700;border-top:1px solid #1B2637;margin-top:8px}
.jsec:first-child{border-top:0;margin-top:0}
.ai-note{padding:12px 20px 0;font-size:11.5px;color:#6C819B;line-height:1.8}
.ai-note b{color:#93B4D6}

@media (max-width:1240px){.doc{padding:22px 20px 80px}}


/* ---- 模板新增 ---- */
.warnbar{background:#FFF3F3;border:1px solid #F3C6C6;border-left:3px solid #D93025;
  border-radius:0 8px 8px 0;padding:11px 14px;margin:0 0 16px;font-size:12.5px;color:#8A2B22;line-height:1.8}
.warnbar b{color:#B3261E}
.dlg{background:#fff;border:1px solid #E6EEF7;border-radius:10px;overflow:hidden;margin:0 0 14px}
.dlg table{width:100%;border-collapse:collapse;font-size:12.5px}
.dlg th{background:#F4F8FD;color:#3D5B7A;font-weight:700;text-align:left;padding:9px 12px;
  font-size:11.5px;border-bottom:1.5px solid #E1EBF6;white-space:nowrap}
.dlg td{padding:9px 12px;border-bottom:1px solid #F0F5FA;vertical-align:top}
.dlg tr:last-child td{border-bottom:0}
.dlg .tp{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.dlg .tp.page{background:#EAF2FD;color:#1E6FD9}
.dlg .tp.dlg{background:#FFF6E8;color:#B45309}
.dlg .tp.drawer{background:#F3EEFB;color:#6B46C1}
.dlg .cov{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px}
.dlg .cov.y{background:#EAF7EE;color:#1B7F45}
.dlg .cov.n{background:#F1F5FA;color:#93A5B8}
.smn{font-size:11px;color:#7A6350;background:#FFFCF5;border-left:2px solid #E9C77B;
  padding:8px 11px;border-radius:0 6px 6px 0;line-height:1.75;margin-top:9px}
.empty{color:#9AAABA;font-size:12px;font-style:normal}
.doc h3.sub3{font-size:12.5px;color:#3D5B7A;margin:18px 0 9px;font-weight:700}
/* 附录/实现说明书块：文档里凡是「某个弹窗的变量怎么算」这类落到代码的说明，
   都用这个块，跟业务叙事分开，读者一眼知道这是给开发看的 */
.spc{border:1px solid #E1EBF6;border-radius:10px;margin:14px 0 18px;overflow:hidden;background:#fff}
.spc-hd{background:#F3F8FD;border-bottom:1px solid #E1EBF6;padding:10px 14px;font-size:12.5px;
  color:#3D5B7A;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spc-hd .k{font-size:10.5px;color:#fff;background:#1E6FD9;border-radius:4px;padding:1px 7px;font-weight:600}
.spc-bd{padding:14px 16px}
.spc-bd>:first-child{margin-top:0}
.spc-bd>:last-child{margin-bottom:0}
.spc-bd h3{margin:18px 0 8px}
.spc-bd h3:first-child{margin-top:0}
/* 来源等级：标在每一条口径上。不标的话开发分不清「照现状接」还是「这次新建」 */
.lv{display:inline-block;font-size:10.5px;line-height:17px;padding:0 7px;border-radius:4px;
  white-space:nowrap;font-weight:600;vertical-align:1px}
.lv-ok{background:#E8F7EE;color:#1B7F45;border:1px solid #CFEBD9}
.lv-set{background:#FFF6E5;color:#A9660E;border:1px solid #F0D8A8}
.lv-tbd{background:#FEF0F0;color:#C0332B;border:1px solid #F6D2CE}
/* 文档内跳转：从原型点一下跳到某段说明，反过来也常用 */
.golink{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#1E6FD9;
  border:1px solid #C9DDF5;background:#F5FAFF;border-radius:6px;padding:3px 10px;
  cursor:pointer;font-weight:600;text-decoration:none;line-height:1.6}
.golink:hover{background:#EAF3FE;border-color:#93C0EE}
.golink::after{content:"→";font-weight:700}
.spc.hl,.spc-bd h3.hl,.spc-bd table.hl{box-shadow:0 0 0 3px rgba(30,111,217,.22);border-radius:8px}
.ai-body pre.yaml{margin:0;font-family:var(--mono,monospace);font-size:11.5px;line-height:1.85;
  color:#B9D3EC;white-space:pre-wrap;word-break:break-word}
.jline.hl{background:#1E3A5F;outline:1px solid #4A7FB5;border-radius:4px}
.jline{transition:background .2s}
/* 跳转高亮：AI 行、事实卡、规则卡共用 */
.fcard.hl{box-shadow:0 0 0 2px #1E6FD9, 0 4px 18px rgba(30,111,217,.18);border-color:#7FB3EE}
.rule.hl{box-shadow:0 0 0 2px #1E6FD9, 0 4px 18px rgba(30,111,217,.18)}
.fcard,.rule{transition:box-shadow .2s,border-color .2s}
/* 交叉引用：正文里出现的规则号 / 迁移号 / 事实号 / 模块名，点了能到。
   样式刻意做轻——一段话里出现七八个引用是常态，全做成蓝色实心头会盖过正文。 */
a.xref{color:#1B64C0;text-decoration:none;border-bottom:1px dashed rgba(27,100,192,.45);
  cursor:pointer;transition:background .12s,border-color .12s;
  white-space:nowrap}
a.xref:hover{background:#EAF2FD;border-bottom-color:#1B64C0}
a.xref code,a.xref .mono{color:inherit}
code a.xref,pre a.xref{color:#B0244F;border-bottom:1px dotted rgba(176,36,79,.5)}
code a.xref:hover{background:#FFF0F5}
/* 模块名引用：颜色跟正文一致，只靠一条浅虚线暗示可点 */
a.xref.mod{color:inherit;border-bottom:1px dotted #8FA9C2;white-space:normal}
a.xref.mod:hover{color:#1B64C0;background:#F2F8FF;border-bottom-color:#1B64C0}
/* 状态机迁移行作为落点：跳过来时整行闪一下，不然滚到表中间不知道看哪 */
tr.hl td{background:#FFF8E1;transition:background .2s}
.doc .tw table.mono td.mono{font-family:var(--mono,monospace);font-size:11.5px;white-space:nowrap}

/* ==================================================================
   四视图：原型 / 叙事 / AI 读 / 核查
   ================================================================== */
.modes button{padding:6px 12px}
.modes button .n{font-family:var(--mono);font-size:9.5px;opacity:.55;margin-left:3px}

/* ---------- 实体关系 ---------- */
.lead-sub{font-size:12.5px;color:var(--sub);margin:-6px 0 14px}
.er{border-left:2px solid #E3EDF8;margin:0 0 18px;padding-left:14px}
.er-n{position:relative;margin:0 0 10px;padding:2px 0 2px 12px;border-left:2px solid #CFE0F4}
.er-t{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:4px}
.er-t::before{content:"";position:absolute;left:-5px;top:9px;width:8px;height:8px;
  border-radius:50%;background:#1E6FD9;box-shadow:0 0 0 3px #EAF2FD}
.er-kv{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:3px 0 3px 12px;font-size:12.5px}
.er-k{color:var(--sub);font-size:12px}
.er-v{color:var(--txt);line-height:1.7}

/* 跳转落点：跳到某一改动块后在它周围闪一圈，明确「跳到的是这块」 */
.dchg.landed,.spc.landed{animation:landRing 1.6s ease-out}
@keyframes landRing{
  0%   {box-shadow:0 0 0 0 rgba(30,111,217,.55)}
  35%  {box-shadow:0 0 0 6px rgba(30,111,217,.22)}
  100% {box-shadow:0 0 0 0 rgba(30,111,217,0)}
}
@media (prefers-reduced-motion:reduce){ .dchg.landed,.spc.landed{animation:none} }

/* 操作日志的「操作前 / 操作后」两块标签：创建记录的前一块是空的，照系统留白，不加占位文字 */
.px-cmp-lb{font-size:12px;color:#8A9AAB;margin:0 0 8px;letter-spacing:.02em}
.px-cmp-lb.gap{margin-top:16px}
.px-cmp-empty{height:44px;margin:0 0 16px;border-radius:4px;background:#FBFCFE}
.px-cmp-sep{height:1px;background:#F0F5FA;margin:0 0 14px}

/* ---------- 用例栏 ---------- */
.cases-body{padding:22px 26px 80px;max-width:1080px;margin:0 auto}
.case-sum{font-size:12px;color:var(--sub)}
.cg{margin:0 0 26px}
.cg-hd{display:flex;align-items:baseline;gap:9px;margin:0 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.cg-hd b{font-size:13.5px;color:var(--deep)}
.cg-hd i{font-style:normal;font-size:11.5px;color:var(--sub)}
.cs{border:1px solid var(--line);border-radius:9px;margin:0 0 9px;background:#fff;overflow:hidden}
.cs-hd{display:flex;gap:9px;align-items:baseline;padding:9px 13px;background:#FAFCFE;
  border-bottom:1px solid #F0F5FA;flex-wrap:wrap}
.cs-hd .cid{font-family:var(--mono);font-size:11px;color:#7B6BA8;background:#F4F0FB;
  border:1px solid #E3DAF5;border-radius:4px;padding:0 6px;white-space:nowrap}
.cs-hd .ct{font-size:13px;color:var(--deep);font-weight:600;flex:1;min-width:180px}
.cs-hd .cr{font-family:var(--mono);font-size:10.5px;color:var(--blue);background:var(--blue-l);
  border:1px solid #D3E5FA;border-radius:4px;padding:0 5px;cursor:pointer}
.cs-bd{padding:11px 13px 13px;display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:12.5px}
.cs-bd .k2{color:var(--sub);font-size:11.5px;padding-top:1px}
.cs-bd ol{margin:0;padding-left:17px}
.cs-bd ol li{margin:0 0 2px}
.cs-gap{margin-top:7px;grid-column:1/-1;font-size:12px;color:#8A5A00;background:#FFFBF0;
  border-left:2px solid #E9C77B;padding:6px 9px;border-radius:0 5px 5px 0}
.cs-src{grid-column:1/-1;font-size:11px;color:#9AAABA}

/* ---------- 代码栏 ---------- */
.code-body{padding:22px 26px 80px;max-width:1080px;margin:0 auto}
.cb-sec{margin:0 0 26px}
.cb-sec>h3{font-size:14px;color:var(--deep);margin:0 0 4px}
.cb-sec>.lead{font-size:12px;color:var(--sub);margin:0 0 12px}
.cq{border-left:3px solid var(--blue);background:#F7FBFF;border-radius:0 8px 8px 0;
  padding:11px 14px;margin:0 0 9px}
.cq .q{font-size:13px;color:var(--deep);font-weight:600;margin-bottom:4px}
.cq .a{font-size:12.5px;color:var(--txt);line-height:1.75}
.tb2{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
.tb2 th{background:#F5F9FD;color:#41586F;font-weight:600;text-align:left;
  padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px}
.tb2 td{padding:8px 10px;border-bottom:1px solid #F2F6FA;vertical-align:top}
.tb2 tr:last-child td{border-bottom:0}
.tb2 .tpath{font-family:var(--mono);font-size:11px;color:#7A8A9C;word-break:break-all}
.tb2-wrap{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 14px}
.cb-note{font-size:12px;color:#8A5A00;background:#FFFBF0;border-left:2px solid #E9C77B;
  padding:7px 11px;border-radius:0 5px 5px 0;margin:0 0 7px}
.cb-fold{border:1px solid var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.cb-fold>summary{cursor:pointer;padding:10px 14px;background:#F7FAFD;font-size:12.5px;color:#3D5B7A;font-weight:600}
.cb-fold[open]>summary{border-bottom:1px solid var(--line)}

/* ---------- 原型区 ---------- */
.pane.proto{background:#EEF3F9;border-right:1px solid var(--line)}
body.both .pane.proto{flex:0 0 50%}
/* 纯原型：只留图，占满整屏，去掉右分隔线。演示/评审时投屏用 */
body.proto .pane.proto{flex:1 1 100%;border-right:0}
body.proto .pane-hd .k{color:#1E6FD9}
.ptabs{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;background:#fff;
  border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.ptab{border:1px solid #E3EAF3;background:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;
  cursor:pointer;white-space:nowrap;color:#5C6F84;font-family:inherit;transition:.15s;line-height:1.5}
.ptab:hover{border-color:#B7CDE8;color:var(--blue)}
.ptab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.ptab em{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.7;margin-right:4px}
.pscroll{flex:1;min-height:0;overflow:auto;padding:14px 12px 40px}
.pbounds{position:relative;margin:0 auto}
.pwrap{position:absolute;left:0;top:0;transform-origin:0 0}
.pframe{background:#fff;border-radius:8px;overflow:hidden;
  box-shadow:0 2px 16px rgba(24,64,120,.13);border:1px solid #DCE6F2}
/* 所有帧统一按设计尺寸的画布，切换时不跳动 */
.pframe>
.pnote{max-width:min(980px,100%);margin:9px auto 0;font-size:11px;color:#8CA0B4;line-height:1.7}
.pnote code{font-family:var(--mono);font-size:10.5px;background:#E6EEF7;color:#3D6288;
  padding:1px 5px;border-radius:3px;margin-right:3px;white-space:nowrap}

/* ---------- 原型组件库 px-（团队只写 class，不写 style） ---------- */
.px{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  font-size:14px;color:#1F2A37;background:#F5F7FA;display:flex;flex-direction:column;
  width:1440px;min-height:600px;line-height:1.5;position:relative;overflow:hidden}
/* 画布要撑满外层框：弹窗/抽屉是 position:absolute + inset:0，锚的是 .px 的盒子。
   .px 停在 min-height:600 而外层框 900 时，遮罩只盖住上面 600，弹窗底部按钮正好
   被 overflow:hidden 切掉一半（2026-11-06 字段详情帧就是这么被看出来的）。
   :not(.full) —— .px.full 是整页长帧，高度必须跟着内容走。 */
.pframe > .px:not(.full){min-height:100%}
/* 高弹窗帧用：弹窗本身很高时，画布跟着加高，否则底部按钮会被 overflow:hidden 切掉 */
.px.tall{min-height:680px}
/* 整页帧：长页面不要拆成多帧，一页一帧、画布跟着内容长高。
   默认 .px 是 1440×≥600 的「视口」，.px-main 内部滚动 —— 静态图里滚动区之外的内容
   会被裁掉，读者以为这页只有半屏，于是有人把一页拆成好几个「页签帧」。
   长页面改用 .px.full：高度由内容撑开，整页一次画完，滚动条不再吃内容。 */
.px.full{min-height:0;overflow:visible}
.px.full .px-main{overflow:visible}
.px.full .px-side{align-self:stretch}
.px *{box-sizing:border-box}
.px-top{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:#0B2E4E;color:#fff}
.px-logo{font-weight:700;font-size:15px;letter-spacing:.3px}
.px-logo i{font-style:normal;color:#4FB0F0}
.px-tmenu{display:flex;gap:2px;margin-left:10px}
.px-tmenu span{padding:5px 11px;border-radius:6px;font-size:13px;color:#C6D8E8;cursor:default}
.px-tmenu span.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.px-tright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#C6D8E8}
.px-av{width:26px;height:26px;border-radius:50%;background:#4FB0F0;color:#0B2E4E;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.px-body{flex:1;min-height:0;display:flex}
.px-side{width:196px;flex:0 0 auto;background:#fff;border-right:1px solid #E6EDF5;padding:10px 0}
.px-mi{padding:9px 18px;font-size:13px;color:#4A5C6E;display:flex;align-items:center;gap:8px}
.px-mi.on{background:#EAF2FD;color:#1E6FD9;font-weight:600;border-right:3px solid #1E6FD9}
.px-mi.sub{padding-left:34px;font-size:12.5px}
.px-mi.sub.on{background:#F2F7FE;border-right-color:#7FB3EE}
.px-main{flex:1;min-width:0;padding:16px 20px 26px;overflow:auto}
.px-crumb{font-size:12px;color:#8CA0B4;margin-bottom:8px}
.px-crumb i{font-style:normal;margin:0 5px;color:#C3D0DE}
.px-h1{font-size:18px;font-weight:700;color:#0B2E4E;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.px-card{background:#fff;border-radius:8px;border:1px solid #E9EFF6;margin-bottom:14px}
.px-card-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #EFF3F8;
  font-size:14px;font-weight:600;color:#1F2A37}
.px-card-hd .sp{flex:1}
.px-card-bd{padding:14px 16px}
.px-btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid #D6DFE9;background:#fff;
  color:#1F2A37;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;
  cursor:default;white-space:nowrap}
.px-btn.pri{background:#1E6FD9;border-color:#1E6FD9;color:#fff;font-weight:500}
.px-btn.danger{color:#D93025;border-color:#F3C6C6}
.px-btn.sm{height:26px;padding:0 9px;font-size:12px}
.px-btn.link{border:0;background:transparent;color:#1E6FD9;padding:0 4px;height:auto}
.px-btn.link.d{color:#D93025}
.px-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.px-toolbar .sp{flex:1}
.px-in,.px-sel{height:32px;border:1px solid #DCE3EC;border-radius:6px;background:#F5F7FA;
  padding:0 10px;font-size:13px;color:#1F2A37;display:inline-flex;align-items:center;min-width:180px}
.px-in.ph{color:#9AAABA}
.px-sel{justify-content:space-between;min-width:150px;background:#fff}
.px-sel::after{content:"▾";color:#8CA0B4;font-size:10px;margin-left:8px}
.px-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.px-table th{background:#F7FAFD;color:#41566E;font-weight:600;text-align:left;padding:10px 12px;
  border-bottom:1px solid #E6EDF5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:12.5px}
.px-table td{padding:11px 12px;border-bottom:1px solid #F0F5FA;color:#1F2A37;vertical-align:middle;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px-table tr:last-child td{border-bottom:0}
.px-table tr:hover td{background:#FAFCFF}
.px-table .w-s{width:84px}
.px-table .w-m{width:132px}
.px-table .w-l{width:24%}
.px-table .w-xl{width:30%}
/* 宽表：列多到装不下时按内容撑开，外层 .px-tw 横向滚动（快照类表格用，不折叠、不合并列） */
.px-table.wide{table-layout:auto;width:max-content;min-width:100%}
.px-table.wide th,.px-table.wide td{overflow:visible;text-overflow:clip}
/* 快照按协议分组：每组一张小表，表头只列该协议需要的字段。
   为什么不用一张并集宽表：并集表里同一列名在不同协议下含义不同（银行编码在 清算网络A 是 Routing，
   在本地清算是分行号），空着的格子读不出「不需要」还是「没填」 */
.px-grp{border:1px solid #E9EFF6;border-radius:8px;overflow:hidden;margin-top:9px;background:#fff}
.px-grp-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#F7FAFD;
  border-bottom:1px solid #E6EDF5;font-size:12.5px;color:#41566E}
.px-grp-hd b{color:#0B2E4E;font-weight:600}
.px-grp-hd .px-sp{flex:1 1 auto}
.px-grp .px-table th{background:#FBFDFF;padding:8px 12px}
.px-grp .px-table td{padding:9px 12px}
/* 「当时怎么来的」这类备注不截断——出事时这一格往往就是答案，省略号会把答案吃掉 */
.px-grp .px-table td.px-wrap{white-space:normal;word-break:break-word;line-height:1.55}
/* 分组表列少但列宽不一，用比例列宽。table-layout:fixed 下只要有一列没给宽度，
   它就只能拿「总宽 - 已指定」的残值——实测被压到 40px，「1000.00」显示成「1...」 */
.px-table .pw1{width:6%}
.px-table .pw2{width:9%}
.px-table .pw3{width:11%}
.px-table .pw4{width:13%}
.px-table .pw5{width:15%}
.px-table .pw6{width:18%}
.px-table .pw7{width:22%}
/* 向导型页面（新增人员这类两步流程）的步骤条。实拍是居中圆点 + 编号 + 连线 */
.px-steps{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 20px}
.px-step{display:flex;align-items:center;gap:7px;font-size:13px;color:#8CA0B4}
.px-step.on{color:#1E6FD9;font-weight:600}

  display:inline-flex;align-items:center;justify-content:center;
  font:600 12px/1 -apple-system,"PingFang SC";font-style:normal}
.px-step.on i{background:#1E6FD9;color:#fff}
.px-step .ln{width:150px;height:1px;background:#E1E8F1;margin-left:5px}
/* 向导页底部按钮居中（列表页脚是右对齐） */
.px-foot.c{justify-content:center;border-top:1px solid #EFF3F8;padding:14px 0 6px;margin-top:18px}
.px-tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;line-height:18px;
  background:#F1F5FA;color:#5C6F84;border:1px solid #E3EAF3;white-space:nowrap}
.px-tag.blue{background:#EAF2FD;color:#1E6FD9;border-color:#D3E4FA}
.px-tag.green{background:#EAF7EE;color:#1B7F45;border-color:#CFEBD9}
.px-tag.red{background:#FEF1F0;color:#D93025;border-color:#F8D6D3}
.px-tag.amber{background:#FFF6E8;color:#B45309;border-color:#F6E3C4}
.px-tag.purple{background:#F3EEFB;color:#6B46C1;border-color:#E2D6F7}
.px-tag.slate{background:#EEF2F0;color:#4B5A66;border-color:#D8E2DD}
.px-sw{width:38px;height:20px;border-radius:10px;background:#C9D4E0;position:relative;display:inline-block}
.px-sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.px-sw.on{background:#1E6FD9}
.px-sw.on::after{left:20px}
.px-chk{width:15px;height:15px;border:1px solid #C9D4E0;border-radius:3px;display:inline-block;
  vertical-align:-3px;background:#fff}
.px-chk.on{background:#1E6FD9;border-color:#1E6FD9;position:relative}
.px-chk.on::after{content:"✓";color:#fff;font-size:11px;position:absolute;left:2px;top:-3px}
.px-tabs{display:flex;gap:20px;border-bottom:1px solid #E6EDF5;margin-bottom:14px}
.px-tab{padding:9px 0;font-size:13.5px;color:#5C6F84;border-bottom:2px solid transparent}

.px-empty{padding:40px;text-align:center;color:#9AAABA;font-size:13px}
/* 列表底栏：左边批量动作、右边分页。真实后台（单据工作台）就是这样一排 */
.px-lfoot{display:flex;align-items:center;padding:12px 4px 0;margin-top:4px}
.px-lfoot .px-pager{padding:0;flex:0 0 auto}
.px-pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 4px 0;
  font-size:12.5px;color:#6E8298}
.px-pager b{display:inline-flex;min-width:26px;height:26px;align-items:center;justify-content:center;
  border:1px solid #E3EAF3;border-radius:5px;font-weight:400;background:#fff}
.px-pager b.on{background:#1E6FD9;color:#fff;border-color:#1E6FD9}
/* 表单：3 列栅格，末项整行 */
.px-form{display:flex;flex-wrap:wrap;gap:16px 18px}
.px-form.c2 .px-frow{flex:0 0 calc((100% - 18px) / 2)}

.px-fctrl{width:100%;height:32px;border:1px solid #DCE3EC;border-radius:6px;background:#F5F7FA;

/* 详情页：分块 / 字段网格 / 统计 / 上传 / 审批记录 */

.px-segi.on::before{content:"●";font-size:8px;margin-right:5px;vertical-align:1px}
.px-segi:not(.on)::before{content:"○";font-size:9px;margin-right:5px;color:#BFC9D6}
.px-sub{font-size:13px;font-weight:600;color:#16202E;margin:2px 0 12px;
  display:flex;align-items:center;gap:8px}
.px-person{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.px-pav{width:44px;height:44px;border-radius:8px;background:#EAF1FB;color:#346FC5;
  font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:600}
.px-pname{font-size:14px;font-weight:600;color:#16202E}
.px-pdept{font-size:12px;color:#7A8B9E;margin-top:2px}
.px-tbwrap{margin:4px 0}
.px-stats{display:flex;gap:10px;flex-wrap:wrap}
.px-stat{flex:1 1 0;min-width:104px;background:#F8FBFF;border:1px solid #E6EEF8;
  border-radius:6px;padding:10px 12px;text-align:center}
.px-stat-n{font-size:20px;font-weight:600;color:#1E6FD9;line-height:1.3}
.px-stat-l{font-size:12px;color:#7A8B9E;margin-top:2px}
.px-total{display:flex;justify-content:flex-end;gap:6px;font-size:13px;color:#41566E;
  margin-top:12px;padding-top:10px;border-top:1px dashed #E6EEF8}
.px-total b{color:#E8590C;font-weight:600}
/* 弹窗：叠在整页原型上。.px 已是 position:relative，蒙层直接盖满 */

.px-dlg{width:580px;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 20px 56px rgba(11,46,78,.34)}
.px-dlg-hd{padding:19px 22px 0;display:flex;align-items:center;gap:9px}
.px-dlg-hd b{font-size:16px;color:#0B2E4E;font-weight:600}
.px-dlg-ico{width:20px;height:20px;border-radius:50%;background:#FFF1E3;color:#D97706;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.px-dlg-bd{padding:13px 22px 4px;font-size:13.5px;line-height:1.85;color:#41566E}
.px-dlg-bd p{margin:0 0 10px}
.px-dlg-note{background:#FFF7E8;border:1px solid #F6E3C4;border-radius:7px;
  padding:11px 13px;font-size:12.5px;line-height:1.8;color:#8A5A1B}
.px-dlg-note b{color:#8A4B0B}
.px-dlg-ft{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px 19px}
.px-dlg-sub{margin:11px 0 0;font-size:12.5px;color:#8FA3B8;line-height:1.7}
/* 弹窗里指向「变量显示规范」的入口条：原型上点一下，右侧文档直接滚到那一节 */
.px-dlg-spec{padding:12px 0 0;border-top:1px dashed #E6EEF7;margin-top:13px}
.px-dlg-spec .golink{font-size:13px;padding:5px 13px}
/* 长文本按单元格宽度截断。线框图必须直接画出「超长时是省略号」，不能只写一句规则：
   研发看的是图，图里换行还是省略号，他就照着做哪个。 */
.px-ellip{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-sum{display:flex;gap:20px;flex-wrap:wrap;background:#F7FAFD;border:1px solid #E6EEF7;
  border-radius:7px;padding:11px 14px;margin:0 0 12px;font-size:13px;color:#1F2A37}
.px-sum i{font-style:normal;color:#8FA3B8;margin-right:5px}
/* 卡片头右侧的只读说明：替代原来那个「批量修改」按钮的位置 */
.px-hint{font-size:11.5px;color:#8A5A1B;background:#FFF7E8;border:1px solid #F6E3C4;
  border-radius:5px;padding:3px 9px;line-height:1.5}
/* 状态格下面的一行小字：失败原因 / 未发起提示 */
.px-fail{display:inline-block;margin-top:3px;font-size:10.5px;line-height:1.5;color:#B45309}
.px-fail.red{color:#C62828}
/* 协议分组：一张出款单里，不同的人可能走不同清算网络，字段各不相同。
   按协议拆成若干组，每组一张小表，列只保留该协议真正要的字段——
   一张并集宽表会把「银行代码」在 清算网络A 是 routing number、在 清算网络E 是 银行代码 混成一列，诱导填错 */
.px-grp{border:1px solid #E3EAF3;border-radius:8px;margin:9px 0;overflow:hidden;background:#fff}
.px-grp-hd{display:flex;align-items:center;gap:8px;padding:8px 11px;background:#F7FAFD;
  border-bottom:1px solid #E8EFF7;font-size:12px;color:#41566E}
.px-grp-hd b{font-size:12.5px;color:#0B2E4E;font-weight:600}
.px-grp-hd .gt{font-size:11px;color:#7C93AC}
.px-grp-hd .px-sp{flex:1}
.px-grp .px-table th{font-size:11px;padding:7px 9px;background:#FBFDFF}
.px-grp .px-table td{font-size:11.5px;padding:8px 9px}
/* 一次出款的批次汇总条：几人 / 多少钱 / 分几批 */
.px-batch{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#F3F8FD;
  border:1px solid #DCE8F5;border-radius:7px;padding:9px 12px;margin:2px 0 6px;font-size:12.5px;color:#1F2A37}
.px-batch i{font-style:normal;color:#8FA3B8;margin-right:5px}
.px-batch .px-sp{flex:1}
.px-gt{font-size:10.5px;color:#8FA3B8}
/* 多值标签组：一张单里多币种 → 多协议，平铺放不下时折成「+N」，
   悬停展开逐条（币种 → 协议 → 金额）。单值场景直接用 .px-tag 即可，不需要这套。 */
.px-tags{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;vertical-align:middle}
.px-tags .px-tag{margin:0}
.px-more{display:inline-block;font-size:11px;line-height:18px;padding:1px 6px;border-radius:4px;
  background:#F2F6FA;color:#6E8298;border:1px dashed #C9D6E4;cursor:help;white-space:nowrap}
.px-tips{position:relative;display:inline-block}
.px-tips>.px-tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:70;
  background:#fff;border:1px solid #DCE6F2;border-radius:8px;box-shadow:0 8px 24px rgba(16,38,66,.15);
  padding:9px 11px;font-size:11.5px;color:#33465C;line-height:1.6;text-align:left;white-space:normal}
.px-tips:hover>.px-tip,.px-tip.force{display:block}
/* td 自带 overflow:hidden（为了 ellipsis），会把绝对定位的浮层直接切没；
   横滚容器 .px-tw 的 overflow-x:auto 同样会裁。两处都得对「含浮层的表格」放开，否则 hover 永远看不到。 */
.px-table td:has(.px-tips){overflow:visible}
.px-tw:has(.px-tips){overflow:visible}
.px-tips>.px-tip{min-width:250px;width:max-content;max-width:360px}
.px-tip .ln i{flex:0 0 auto}
.px-tip .hd{font-size:10.5px;color:#8296AD;letter-spacing:.04em;margin-bottom:5px}
.px-tip .ln{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-top:1px dotted #EDF2F8}
.px-tip .ln:first-of-type{border-top:0}
.px-tip .ln i{font-style:normal;color:#5C6F84;min-width:52px}
.px-tip .ln b{font-weight:600;color:#0B2E4E}
.px-tip .ln em{font-style:normal;margin-left:auto;color:#8296AD;font-variant-numeric:tabular-nums}
.px-tip .ft{margin-top:6px;padding-top:5px;border-top:1px solid #EDF2F8;font-size:10.5px;color:#8296AD}
/* 抽屉内的口径提示条：用于写"为什么允许带着缺失发起"这类业务裁定 */
.px-alert{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:7px;
  font-size:12px;line-height:1.7;margin:0 0 10px;text-align:left}
.px-alert .ico{flex:0 0 auto;width:16px;height:16px;border-radius:50%;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px;color:#fff;line-height:1}
.px-alert.warn{background:#FFF8EC;border:1px solid #F5E2C0;color:#8A5A12}
.px-alert.warn .ico{background:#E8A33D}
.px-alert.warn b{color:#6B4210}
.px-alert.info{background:#F4F8FD;border:1px solid #DAE8F8;color:#3C5875}
.px-alert.info .ico{background:#4A8AD8}
.px-alert.info b{color:#1E4E7C}
/* 阻断态：只有「不解决就提交不了」才用红。缺字段但允许提交的用 .warn（琥珀），
   用红色表达「不阻断」会让客户以为这单付不出去了——业务方为此纠正过两次 */
.px-alert.danger{background:#FEF3F2;border:1px solid #FDA29B;color:#912018}
.px-alert.danger .ico{background:#D92D20}
.px-alert.danger b{color:#7A271A}
/* 表单只读 / 警示态：新增人员这类页面大量用「自动带出不可改」字段，样式统一在这里，
   页面里不许再写内联 style（否则每个人画出来都不一样） */
.px-fctrl.ro{background:#FAFBFD;color:#8FA3B8}
.px-fctrl.pick{justify-content:space-between}
.px-fctrl.warnf{border-color:#F0C987;background:#FFFBF3;color:#A9660E}
/* 输入框阻断态：真的不能提交时才用；能提交的一律 .warnf */
.px-fctrl.err{border-color:#FDA29B;background:#FEF3F2;color:#B42318}
.px-fh-red{color:#D93025;font-size:12px}
.px-req{color:#D93025;margin-left:2px}
/* 表格里「不可选」的行：整行降饱和，勾选框也变淡 */
.px-table tr.dis td{color:#9AAABA;background:#FAFBFC}
.px-table tr.dis td .px-chk{opacity:.35}
.px-dlg.wide{width:1104px}
.px-fld{flex:0 0 260px}
.px-fbtn{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px}
.px-frow .px-tag{margin-left:8px}
.px-dim{opacity:.5}
.px-mb{margin-bottom:14px}
.px-v{color:#1F2A37}
/* 不可选那一格里的名字：看着像链接、其实是灰的，悬停给原因 */
.px-dislink{color:#9AAABA;border-bottom:1px dashed #C9D6E4;cursor:help}
/* 展开行：该人员按这个协议收到的全部字段。放在行下方而不是另起弹窗，
   因为要跟同行的人对照——"他走 清算网络FA 只要四项，这个人走 清算网络S 要八项" */
.px-exprow td{background:#FBFDFF;border-top:1px dashed #DCE8F5}
.px-exp-hd{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#41566E;margin-bottom:8px}
.px-flist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px}
.px-flist span{font-size:11px;color:#1F2A37;line-height:1.6;
  background:#fff;border:1px solid #E8EFF7;border-radius:5px;padding:5px 8px}
.px-flist i{font-style:normal;color:#8FA3B8;display:block;font-size:10px;margin-bottom:2px}
/* 字段缺失标记：必须是「弱提示」不是「错误」——它只说明这条腿上该协议当前要的字段没填全，
   不说明钱付不出去（付不付得掉要 XPay 判）。红色会让人误判成已失败。 */
.miss{color:#A9660E;background:#FFF6E5;border:1px dashed #EFC98B;border-radius:4px;
  padding:0 5px;font-weight:600;font-size:11px;line-height:16px;display:inline-block;cursor:help}
.px-tips.miss-tip>.px-tip{min-width:300px;max-width:380px}
.px-tips.miss-tip>.px-tip .ln i{flex:0 0 74px;min-width:0}
.px-tips.miss-tip>.px-tip .ln{align-items:flex-start}
/* 列宽档位。col_widths() 一直在吐 w-s/w-m/w-l/w-xl，但模板里从没定义过，
   于是所有列永远均分。7 列的列表里「操作」就被挤掉了第二个入口。 */
.px-table th.w-s{width:84px}
.px-table th.w-n{width:178px}
.px-table th.w-dt{width:104px}
/* 允许换行的单元格：金额、人员名单这类「一条里有多段」的内容，宁可换行也不截断。
   截断会让读的人以为只有一笔/一人。 */
.px-table td.wrap{white-space:normal;word-break:break-word;text-overflow:clip;line-height:1.5}
.px-table th.w-c{width:46px}
/* 宽表：列太多时不压缩，按内容撑开、外层横向滚动（跟后台一致） */
.px-tw{overflow-x:auto}
/* 表头要挂「改①」徽标时用：徽标压在 th 上方，会被 overflow-x 裁掉，
   给容器留一条 13px 的顶边当跑道 */
.px-twh{padding-top:22px}
/* 宽表（9 列以上）按容器均分 + 允许换行 + 小一号字。
   试过 max-content + 横向滚动：那是真实后台的行为，但原型是静态图，
   一张 2008px 的表塞进 1170px 视口，读者只能看到 4 列，等于把表画残了。
   均分 + 换行虽然挤，但 9 列都在，列名和值能对上。 */
.px-tw.wide .px-table{table-layout:fixed;width:100%;font-size:11.5px}
.px-tw.wide .px-table th{white-space:normal;line-height:1.35;padding:8px 9px}
.px-tw.wide .px-table td{white-space:normal;word-break:break-word;overflow-wrap:anywhere;
  line-height:1.5;padding:9px;text-overflow:clip}
.px-table th.w-m{width:216px}
.px-table th.w-l{width:24%}
.px-table th.w-xl{width:28%}
/* 流程卡片：财务请款申请那种一格一格的豆腐块。一条业务请款拆成 N 条财务请款 = N 格 */
.px-fcard{border:1px solid #EDF0F3;border-radius:8px;background:#fff;
  padding:16px 20px 14px;margin:0 0 12px}
.px-fcard:last-child{margin-bottom:0}
.px-fc-hd{display:flex;align-items:center;gap:8px;padding-bottom:12px;
  border-bottom:1px solid #F2F5F9;margin-bottom:4px}
.px-fc-dot{width:7px;height:7px;border-radius:50%;background:#3B82F6;
  flex:0 0 auto;display:block}
.px-fc-k{font-size:13px;color:#41566E}
.px-fc-code{font-size:13px;color:#1E6FD9;font-weight:600;letter-spacing:.2px}
.px-fc-hd .px-tag{margin-left:auto}
.px-fc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;
  padding:9px 0 0}
.px-fc-i{display:flex;gap:14px;font-size:13px;line-height:20px;min-width:0}
.px-fc-l{color:#7A8B9E;flex:0 0 auto}
.px-fc-v{color:#0B2E4E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-upload{display:flex;align-items:center;gap:12px;border:1px dashed #CBD9E8;
  border-radius:6px;padding:14px 16px;background:#FAFCFF}
.px-upbtn{font-size:12.5px;color:#346FC5;border:1px solid #CFE0F5;border-radius:6px;
  padding:4px 12px;background:#fff}
.px-upnote{font-size:12px;color:#8CA0B4}
.px-para{font-size:13px;color:#41566E;line-height:1.7;margin:6px 0}
.px-upwrap{margin:10px 0}
.px-uplabel{font-size:12px;color:#7A8B9E;margin-bottom:6px}
.px-upext{font-size:11.5px;color:#9AAABA;margin-top:6px;line-height:1.6}
.px-th{font-size:19px;font-weight:600;color:#16202E;margin:2px 0 16px;line-height:1.4}
.px-hx{font-size:12px;color:#7A8B9E;font-weight:400}
.px-subcard{border:1px solid #E9EFF6;border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fff}
.px-subcard:last-child{margin-bottom:0}
.px-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding:12px 4px 4px}
.px-foot .px-btn{background:#fff}
.px-fctrl.ph{color:#9AAABA}
.px-fctrl.sel{justify-content:space-between}
.px-fctrl.sel::after{content:"▾";color:#8CA0B4;font-size:10px}
.px-fctrl.area{height:64px;align-items:flex-start;padding-top:7px}
.px-fhint{font-size:11.5px;color:#9AAABA;margin-top:5px;line-height:1.6}
/* 弹窗 / 抽屉 */
.px-mask{position:absolute;inset:0;background:rgba(15,23,36,.45);z-index:20;display:flex;
  align-items:flex-start;justify-content:center;padding-top:56px}
.px-modal{width:560px;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(15,23,36,.3);
  overflow:hidden;max-height:700px;display:flex;flex-direction:column}
.px-modal.wide{width:720px}
.px-modal.mini{width:420px}
.px-modal-hd{padding:14px 18px;font-size:15px;font-weight:600;border-bottom:1px solid #EFF3F8;
  display:flex;align-items:center}
.px-modal-hd .x{margin-left:auto;color:#9AAABA;font-size:16px}
/* 内容比 700 还高的弹窗：让正文自己滚，别把底部按钮挤出盒子——
   .px-modal 是 overflow:hidden，flex 子项不给 min-height:0 时正文会把 footer 顶出去 */
.px-modal-bd{padding:18px;flex:1 1 auto;min-height:0;overflow:auto}
.px-modal-ft{padding:12px 18px;border-top:1px solid #EFF3F8;display:flex;justify-content:flex-end;gap:9px}
.px-drawer{position:absolute;right:0;top:0;bottom:0;width:520px;background:#fff;
  box-shadow:-8px 0 30px rgba(15,23,36,.2);display:flex;flex-direction:column}
.px-drawer-hd{padding:14px 18px;font-size:15px;font-weight:600;border-bottom:1px solid #EFF3F8}
.px-drawer-bd{flex:1;overflow:auto;padding:18px}
.px-drawer-ft{padding:12px 18px;border-top:1px solid #EFF3F8;display:flex;justify-content:flex-end;gap:9px}

/* ---------- 核查区：五源事实清单 ---------- */
.pane.facts{background:#FBFCFE}
.fx{max-width:1000px;margin:0 auto;padding:18px 22px 90px}
.fx-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.fs{border:1px solid #E6EEF7;border-radius:9px;padding:11px 13px;background:#fff}
.fs .n{font-size:21px;font-weight:700;font-family:var(--mono);line-height:1.1}
.fs .l{font-size:11px;color:#8CA0B4;margin-top:3px}
.fx-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 0;background:linear-gradient(#FBFCFE 78%,rgba(251,252,254,0))}
.chip{font-size:11.5px;padding:3px 10px;border-radius:12px;border:1px solid #E0E8F2;background:#fff;
  color:#5C6F84;cursor:pointer;font-family:inherit;line-height:1.7}
.chip:hover{border-color:#B7CDE8;color:var(--blue)}
.chip.on{background:#1E6FD9;color:#fff;border-color:#1E6FD9;font-weight:600}
.chip.s0.on{background:#C62828;border-color:#C62828}
.fx-q{margin-left:auto;height:28px;border:1px solid #E0E8F2;border-radius:6px;padding:0 10px;
  font-size:12px;font-family:inherit;color:#1F2A37;background:#fff;width:170px;outline:none}
.fx-q:focus{border-color:#7FB3EE}
.fgrp{margin-bottom:16px}
.fgt{display:flex;align-items:center;gap:9px;padding:0 0 7px;border-bottom:1px solid #E6EEF7;
  font-size:13px;font-weight:700;margin-bottom:9px}
.fgt u{text-decoration:none;font-size:11px;font-weight:400;color:#8CA0B4}
.fgt .gd{font-size:11px;font-weight:400;color:#9AAABA}
.fcard{background:#fff;border:1px solid #E9EFF6;border-left:3px solid var(--fc,#8CA0B4);
  border-radius:0 9px 9px 0;padding:12px 14px;margin-bottom:9px}
.fcard.hide{display:none}
.fch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fch .id{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--fc,#5C6F84);
  background:#F7FAFD;border:1px solid #E3EAF3;border-radius:4px;padding:1px 6px;cursor:pointer}
.fch .ttl{font-size:13.5px;font-weight:700;color:#16324F;line-height:1.5}
.fch .area{font-size:11px;color:#8CA0B4}
.fch .sp{flex:1}
.ftag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;line-height:16px}
.fsrclist{display:inline-flex;gap:3px}
.fsrclist i{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;
  justify-content:center;font-style:normal;font-size:9px;color:#fff;font-weight:700}

/* ============ 版本迭代改动标注 ============ */
/* 只标到「小模块 / 单元」这一层，不追元素级——很多元素就一两个字，圈出来反而看不见。
   视觉三件套跟项目既有约定一致：粉底 rgba(255,77,121,.065) + 虚线 #F06292 + 徽标 #EC407A */
.px-chg{position:relative;background:rgba(255,77,121,.09)!important;
  border:1.5px dashed #F06292;border-radius:9px}
.px-chg > .px-card-hd{background:transparent!important}
.px-chg-bd{position:absolute;top:-10px;right:10px;z-index:5;display:inline-flex;align-items:center;gap:4px;
  font:600 10px/1 -apple-system,"PingFang SC","Microsoft YaHei";color:#fff;background:#EC407A;
  border-radius:9px;padding:3px 8px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 7px rgba(236,64,122,.38);transition:transform .12s}
.px-chg-bd:hover{transform:translateY(-1px);box-shadow:0 4px 13px rgba(236,64,122,.5)}
.px-chg-bd i{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.8;letter-spacing:.02em}
/* 弹窗里没有「卡片右上角」可挂徽标（.px-dlg 是 overflow:hidden，浮出去会被裁），改用行内徽标 */
.px-chg-bd.inl{position:static;top:auto;right:auto;box-shadow:none;margin:0}
/* 列级改动：整列打底，表头挂徽标纸条 */
.px-table th.chg-col,.px-table td.chg-col{background:rgba(255,77,121,.13)!important}
/* 列级改动左右各一条虚线，整列从上贯到下。只靠 0.075 的粉底，
   缩到 40% 就完全看不出——实测过，用户直接说「没有粉色提示」 */
.px-table td.chg-col{box-shadow:inset 1.5px 0 0 rgba(240,98,146,.55),inset -1.5px 0 0 rgba(240,98,146,.55)}
/* 改动列的单元格内容比普通列多（账户名 + 标签 + 协议），基础样式是 nowrap + 省略号，
   硬撑着不换行就会把「雇佣服务某地区B-XPay」截成「…XPay…」。改动列一律允许换行 */
.px-table td.chg-col{white-space:normal;word-break:break-word;overflow-wrap:anywhere;
  text-overflow:clip;line-height:1.55}
.px-table th.chg-col{position:relative;
  box-shadow:inset 1.5px 0 0 #F06292,inset -1.5px 0 0 #F06292}
/* 表头上的改动编号做成行内小标签。
   试过绝对定位浮在 th 上方：表格容器是 overflow-x:auto，会把溢出的徽标裁掉一半，
   只剩一条粉色边。行内标签不依赖溢出，多窄的列都放得住 */
.px-table th .chg-flag{display:inline-block;font:600 9px/1 -apple-system,"PingFang SC";
  color:#fff;background:#EC407A;border-radius:8px;padding:2px 5px;margin-right:4px;
  vertical-align:1px;white-space:nowrap}
/* 待定块：蓝灰，和「已改」区分开 */
.px-wip{position:relative;border:1.5px dashed #93AECB;border-radius:9px;background:rgba(108,141,181,.045)}
.px-wip-bd{position:absolute;top:-10px;right:10px;z-index:5;font:600 10px/1 -apple-system,"PingFang SC";
  color:#fff;background:#7A9CBE;border-radius:9px;padding:3px 8px;white-space:nowrap}
/* 被选中时脉冲，配合连线定位 */
.px-chg.wired,.px-table th.chg-col.wired,.px-table td.chg-col.wired{
  animation:chgPulse 1.15s ease-in-out infinite}
@keyframes chgPulse{0%,100%{background:rgba(255,77,121,.13)!important}
  50%{background:rgba(255,77,121,.3)!important}}

/* 帧级改动条：当前这一帧改了哪几处，逐条列出、可点跳转。
   原型整体会被缩放到 40%~60%，粉块本身在小屏上不一定看得清，
   所以再在画布上方放一条不缩放的说明——「这一帧有改动」必须一眼可见 */
.pchg{display:none;gap:7px;flex-wrap:wrap;align-items:center;padding:7px 12px;
  background:#FFF5F8;border-bottom:1px solid #F7CBDA}
.pchg.on{display:flex}
.pchg .pk{font:600 10.5px/1 -apple-system,"PingFang SC";color:#C2185B;letter-spacing:.03em}
.pchg a{font-size:11px;line-height:1.5;color:#B01D53;background:#fff;border:1px solid #F5B9CE;
  border-radius:11px;padding:2px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pchg a:hover{background:#FDEBF1;border-color:#EC407A}
.pchg a b{font-family:var(--mono);font-size:10px;color:#fff;background:#EC407A;
  border-radius:8px;padding:1px 5px;margin-right:4px}
.pchg a.wip{border-style:dashed;border-color:#B7CBE0;color:#4B6580;background:#F7FAFD}
.pchg a.wip b{background:#7A9CBE}
/* 改动胶囊：一条平铺，全部实心。 */
.pchg a.old{opacity:.62;border-style:dashed;border-color:#E0CFD5;color:#8A6B76;background:#FDFBFC}
.pchg a.old b{background:#C9A9B5}
.pchg a i{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.75;margin-left:5px}
.pchg .pk.sep{color:#9AA7B5;font-weight:600;padding-left:4px}

/* 标注一视同仁：不再按稿次压暗。 */
.ocbtn{font:600 10.5px/1 -apple-system,"PingFang SC","Microsoft YaHei";color:#B01D53;
  background:#FFF5F8;border:1px solid #F5B9CE;border-radius:10px;padding:3px 9px;
  cursor:pointer;white-space:nowrap;margin-left:8px}
.ocbtn:hover{background:#FDEBF1;border-color:#EC407A}
.ocbtn.on{background:#EC407A;border-color:#EC407A;color:#fff}
body.onlycur .px-chg.old{background:transparent!important;border-color:transparent}
body.onlycur .px-chg.old > .px-chg-bd{display:none}
body.onlycur .px-wip.old{background:transparent!important;border-color:transparent}
body.onlycur .px-wip.old > .px-wip-bd{display:none}
body.onlycur .px-table td.chg-col.old{background:transparent!important;box-shadow:none!important}
body.onlycur .px-table th.chg-col.old{background:transparent!important;box-shadow:none!important}
body.onlycur .px-table th.chg-col.old .chg-flag{display:none}
body.onlycur .doc .dchg.old{background:transparent;border-left-color:#E8ECF1}
body.onlycur .doc .dchg.old > .dchg-bd{display:none}
body.onlycur .doc .dwip.old{background:transparent;border-left-color:#E8ECF1}
body.onlycur .doc .dwip.old > .dchg-bd{display:none}

/* 跨栏连线：both 模式下原型在左、叙事在右，画一条贝塞尔连过去 */
.wire{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60;overflow:visible}
.wire path{fill:none;stroke:#EC407A;stroke-width:1.9;stroke-linecap:round;stroke-dasharray:6 5;
  animation:wireRun .6s linear infinite}
.wire circle{fill:#EC407A}
@keyframes wireRun{to{stroke-dashoffset:-11}}

/* 叙事里的改动块 */
.doc .dchg{position:relative;background:#FFF5F8;border-left:3px solid #F06292;
  padding:12px 14px 11px 16px;border-radius:0 8px 8px 0;margin:13px 0;transition:box-shadow .2s}
.doc .dchg > .dchg-bd{position:absolute;top:-9px;left:12px;font:600 10px/1 -apple-system,"PingFang SC";
  color:#fff;background:#EC407A;border-radius:9px;padding:3px 8px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(236,64,122,.3)}
.doc .dchg.wired{box-shadow:0 0 0 2px rgba(236,64,122,.3),0 6px 18px rgba(236,64,122,.18)}
/* 改动块头部：标题 + 看原型入口。
   原来只有右上角一个浮动的「回原型」按钮，读者容易看不见；这里把入口挪到标题右边，
   帧号直接写在链接上（看原型 P3 →），看完一段改动就知道该翻哪一帧。
   .dchg 和 .dwip 共用一套（两者都可能带 data-chg）。 */
.doc .dchg-hd{position:absolute;top:-9px;left:12px;display:flex;align-items:center;gap:6px;
  max-width:calc(100% - 22px);flex-wrap:wrap}
.doc .dchg-hd > .dchg-bd{position:static}
.doc .dchg-px{font:500 10px/1 -apple-system,"PingFang SC";color:#9AA7B4;text-decoration:none;
  white-space:nowrap;border:1px solid #E3E9F0;border-radius:9px;padding:3px 7px;background:#fff;
  transition:color .15s,border-color .15s,background .15s}
.doc .dchg-px:hover{color:#1E6FD9;border-color:#BBD3F0;background:#F5F9FF}
/* 改动块右上角：反向跳回原型。原型→文字有连线，文字→原型原先没有入口，
   读者看完「为什么改」通常要回去指那处长什么样，只能自己翻帧。 */
.doc .dchg > .dchg-back,.doc .dwip > .dchg-back{position:absolute;top:-10px;right:10px;display:inline-flex;
  align-items:center;gap:4px;padding:1px 2px 1px 0}
.doc .dchg > .dchg-back i,.doc .dwip > .dchg-back i{font-style:normal;font-size:10px;color:#BE6C90;letter-spacing:.04em}
.doc .dwip > .dchg-back i{color:#7A9CBE}
.doc .dchg > .dchg-back .fj,.doc .dwip > .dchg-back .fj{font-family:inherit;font-size:10.5px;font-weight:600;line-height:1;
  padding:3px 8px;border:1px solid #F3BFD2;background:#fff;color:#BE185D;border-radius:9px;cursor:pointer}
.doc .dwip > .dchg-back .fj{border-color:#C6D8EA;color:#2F6BA8}
.doc .dchg > .dchg-back .fj:hover{background:#EC407A;border-color:#EC407A;color:#fff}
.doc .dwip > .dchg-back .fj:hover{background:#4A7FB5;border-color:#4A7FB5;color:#fff}
.doc .dwip{background:#F4F7FB;border-left:3px solid #93AECB;padding:11px 14px 10px 15px;
  border-radius:0 8px 8px 0;margin:12px 0;position:relative}
.doc .dwip > .dchg-bd{position:absolute;top:-9px;left:12px;font:600 10px/1 -apple-system,"PingFang SC";
  color:#fff;background:#7A9CBE;border-radius:9px;padding:3px 8px;white-space:nowrap}

/* 迭代条：本页属于哪个大版本 */
.verbar{background:#FFF5F8;border:1px solid #F7CBDA;border-left:4px solid #EC407A;
  border-radius:0 9px 9px 0;padding:13px 15px;margin:16px 0 4px}
.verbar .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.verbar .vh b{font-size:14px;color:#B0244F}
.verbar .vh .pill{font-family:var(--mono);font-size:10.5px;background:#fff;color:#B0244F;
  border:1px solid #F3B9CC;border-radius:20px;padding:2px 9px}
.verbar p{margin:5px 0;font-size:12px;color:#6B4753;line-height:1.85}
.verbar .ci{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.verbar .ci a{font-size:11px;background:#fff;border:1px solid #F3B9CC;color:#B0244F;
  border-radius:5px;padding:3px 8px;cursor:pointer;text-decoration:none;transition:.13s}
.verbar .ci a:hover{background:#EC407A;color:#fff;border-color:#EC407A}

@media (max-width:1100px){
  .fx-sum{grid-template-columns:repeat(3,1fr)}
  body.both .pane.proto{flex:0 0 50%}
  .wire{display:none}
}
</style>

<script>
var D = window.PRD_DATA || {};
var SRC_META = {
  ui:["浏览器渲染","#1E6FD9"], api:["后端接口","#0F766E"], fe:["前端代码","#6B46C1"],
  be:["后端代码","#B45309"], ima:["用例库","#C62828"], biz:["业务确认","#2E7D32"]
};
var CONF = {"互证":"m-b1","双证":"m-b2","单源":"m-b3","推论":"m-b4",
            "实测":"m-b1","接口":"m-b2","代码":"m-b3","用例":"m-b4","业务确立":"m-b1","确立":"m-b1"};
var CK = {positive:["正例","#1B7F45"], negative:["反例","#D93025"], edge:["边界","#C77700"]};
var TYPE_COLOR = {constraint:"#D93025", permission:"#1B4A7E", transition:"#C77700",
  validation:"#B45309", display:"#5C6F84", calculation:"#0F766E",
  layout:"#6B46C1", principle:"#2E7D32"};
var TYPE_CN = {constraint:"约束", permission:"权限", transition:"状态迁移", validation:"校验",
  display:"显示", calculation:"计算", layout:"布局", principle:"原则"};

function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function raw(s){ return s==null?"":String(s); }

/* ---------- 人读：头 + 来源矩阵 ---------- */
function head(){
  var m = D.meta || {};
  var h = ['<h1>' + esc(m.module||"模块 PRD") + '</h1>'];
  var tags = [];
  if (m.menu)   tags.push(['m-b1', esc(m.menu)]);
  /* 路由 / URL 不放在文档头部：读者是业务方，他只需要知道从哪个菜单进。
     路由与接口地址统一收进「代码逻辑」栏，那里才是研发看的。 */
  if (m.env)    tags.push(['m-gray', esc(m.env)]);
  if (m.customer) tags.push(['m-gray', esc(m.customer)]);
  if (m.date)   tags.push(['m-gray', esc(m.date)]);
  if (m.version)tags.push(['m-b2', esc(m.version)]);
  h.push('<div class="meta">' + tags.map(function(t){
    return '<span class="'+t[0]+'">'+t[1]+'</span>'; }).join('') + '</div>');

  // 缺段警告
  var got = (D.sections||[]).length;
  if (got < 8) {
    h.push('<div class="warnbar"><b>这份文档只有 ' + got + ' / 8 段，不能当定稿用。</b>'
      + '缺的段落在数据里没有内容——补齐再交付。</div>');
  }

  /* 来源矩阵不再挂文档头部：它是「我怎么核的」，属于核查栏。
     正文一上来就摆六源证据，业务方会被吓住；想看证据的人自己切到核查栏。 */
  return h.join('');
}

/* ---------- 人读：8 段 ---------- */
function figButtons(ids){
  /* 这一段讲到的原型帧。写文档时人是从左往右读的，回头找图要自己猜是哪一屏——
     把对应帧直接挂成按钮，点一下左边就切过去。 */
  if (!ids || !ids.length) return '';
  var frames = (D.prototype && D.prototype.frames) || [], m = {};
  frames.forEach(function(f, i){ m[f.id] = i; });
  var ok = ids.filter(function(id){ return m[id] !== undefined; });
  if (!ok.length) return '';
  return '<span class="figjump"><i>原型</i>'
    + ok.map(function(id){
        return '<button class="fj" data-fi="' + m[id] + '" title="切到原型 ' + esc(id) + '">'
          + esc(id) + '</button>';
      }).join('') + '</span>';
}

/* ---------- 反向定位：改动块 → 原型帧 ----------
   原型上点粉块能连到叙事的「本次改动」，反过来没有入口：读者看完为什么改，
   要回去指那处长什么样，只能自己猜是第几帧。这里按 data-chg 编号反查帧，
   把「回原型 P1」挂到改动块右上角。 */
function chgFrames(code){
  var out = [];
  ((D.prototype && D.prototype.frames) || []).forEach(function(f, i){
    var h = f.html || "";
    if (h.indexOf('data-chg="' + code + '"') >= 0 || h.indexOf("data-chg='" + code + "'") >= 0) out.push(i);
  });
  return out;
}
function linkChgBack(){
  var doc = document.getElementById("doc");
  if (!doc) return;
  var frames = (D.prototype && D.prototype.frames) || [];
  Array.prototype.forEach.call(doc.querySelectorAll(".dchg[data-chg], .dwip[data-chg]"), function(box){
    if (box.querySelector(".dchg-px")) return;        // 作者自己写了定位条，不重复插
    var code = box.getAttribute("data-chg");
    var idx = chgFrames(code);
    if (!idx.length) return;                          // 纯规则改动、原型上没落点：不挂链接
    var bd = box.querySelector(".dchg-bd");
    if (!bd) return;
    // 标题和入口放进同一个头部容器，链接自然排在标题右边
    var hd = document.createElement("div");
    hd.className = "dchg-hd";
    box.insertBefore(hd, box.firstChild);
    hd.appendChild(bd);
    idx.slice(0, 2).forEach(function(i){
      var a = document.createElement("a");
      a.className = "dchg-px";
      a.setAttribute("data-back-chg", code);
      a.setAttribute("data-back-fi", i);
      a.title = "跳到原型 " + frames[i].id + " 上的这处改动";
      a.textContent = "看原型 " + frames[i].id + " →";
      hd.appendChild(a);
    });
  });
}
function jumpChgBack(code, fi){
  var pp = document.getElementById("paneProto");
  // 在看用例/代码/核查栏时原型栏是藏着的，跳过去什么也看不见——先切回双栏
  if (!pp || pp.classList.contains("hide")) goMode("both");
  showFrame(fi);
  wireTo(code);                                  // 复用正向那套：高亮 + 滚动 + 画线
  var el = document.querySelector('#pwrap [data-chg="' + code + '"]');
  if (el) el.scrollIntoView({block: "center", behavior: "auto"});
  // 帧刚换完，尺寸还没稳定，下一帧再补一次线，否则线可能落在旧位置
  requestAnimationFrame(function(){ paint(code); });
}

function renderSections(){
  var out = [];
  (D.sections||[]).forEach(function(sec){
    out.push('<h2>' + sec.n + '. ' + esc(sec.title)
      + (sec.sub ? '<em>' + esc(sec.sub) + '</em>' : '')
      + figButtons(sec.frames) + '</h2>');
    if (sec.html) out.push(raw(sec.html));
    if (sec.dialogs || (sec.n === 3 && D.dialogs)) {
      out.push('<h3 class="sub3">本模块包含的页面与弹窗</h3>' + dialogTable(D.dialogs));
    }
    if (sec.rules) out.push((D.rules||[]).map(ruleCard).join('') || '<p class="empty">（本期无业务规则）</p>');
    if (sec.statemachine) out.push(stateMachine(D.transitions));
    if (sec.statemachine) out.push(erBlock(D.entities));
  });
  return out.join('');
}

/* ---------- 人读：弹窗/二级页清单 ---------- */
function dialogTable(list){
  if (!list || !list.length) return '<p class="empty">（本模块无弹窗或二级页）</p>';
  var h = ['<div class="dlg"><table><tr><th style="width:76px">类型</th><th style="width:180px">名称</th>'
    + '<th style="width:200px">入口</th><th>路由 / 组件</th><th style="width:60px">覆盖</th></tr>'];
  list.forEach(function(d){
    var tp = d.type === "二级页" ? "page" : (d.type === "抽屉" ? "drawer" : "dlg");
    h.push('<tr><td><span class="tp ' + tp + '">' + esc(d.type) + '</span></td>'
      + '<td><b>' + esc(d.name) + '</b></td>'
      + '<td>' + esc(d.entry||"—") + '</td>'
      + '<td><code>' + esc(d.route||"—") + '</code></td>'
      + '<td><span class="cov ' + (d.covered === false ? "n" : "y") + '">'
      + (d.covered === false ? "未收" : "已收") + '</span></td></tr>');
  });
  h.push('</table></div>');
  return h.join('');
}

/* ---------- 人读：规则卡 ---------- */
function ruleCard(r){
  var c = TYPE_COLOR[r.type] || "#5C6F84";
  var conf = CONF[r.confidence] || "m-gray";
  var srcs = (r.src||[]).map(function(s){
    var m = SRC_META[s]; return m ? '<span class="src">' + m[0] + '</span>' : '';
  }).join('');
  var h = ['<div class="rule" style="--rc:' + c + '" id="rc-' + esc(r.id) + '">',
    '<div class="hd"><button class="rid" data-jump="' + esc(r.id) + '">' + esc(r.id) + '</button>',
    '<span class="rtype">' + (TYPE_CN[r.type]||r.type) + '</span>',
    '<span class="rconf ' + conf + '">' + esc(r.confidence||"—") + '</span>',
    srcs, '</div>'];
  h.push('<div class="st">' + raw(r.statement) + '</div>');
  if (r.evidence) h.push('<div class="ev">evidence: ' + raw(r.evidence) + '</div>');
  var cs = r.cases || [];
  if (cs.length) {
    h.push('<div class="cases">');
    cs.forEach(function(x){
      var cm = CK[x.k] || CK.edge;
      h.push('<div class="case c-' + (x.k==="positive"?"pos":(x.k==="negative"?"neg":"edge")) + '">'
        + '<span class="ck">' + cm[0] + '</span><div class="cb">'
        + '<b>给定</b> ' + raw(x.g) + '，<b>当</b> ' + raw(x.w) + '，<b>则</b> ' + raw(x.t)
        + '</div></div>');
    });
    h.push('</div>');
  }
  if (r.note) h.push('<div class="smn">' + raw(r.note) + '</div>');
  var fs = r.facts || [];
  if (fs.length) h.push('<div class="frel">依据' + fs.map(function(x){
    return '<a data-fact="' + esc(x) + '">' + esc(x) + '</a>'; }).join('') + '</div>');
  h.push('</div>');
  return h.join('');
}

/* ---------- 人读：状态机（由迁移表渲染，不手画） ---------- */
/* ---------- 实体关系：谁生成谁、出事往哪找 ----------
   原来这段是 YAML 原文，只有研发看得懂。业务方真正要知道的是「这笔单据从哪来、跟谁有关」，
   所以按缩进还原成层级，一级一个卡片，父子关系用缩进和竖线表达。 */
function erBlock(text){
  if (!text || !String(text).trim()) return '';
  var lines = String(text).split("\n");
  var h = ['<h3 style="margin-top:26px">这笔单跟谁有关系</h3>'
    + '<p class="lead-sub">系统里没有「一笔业务」，只有一串互相引用的单据。'
    + '知道谁生成谁，出问题时才晓得顺着哪条线往上找。</p>'
    + '<div class="er">'];
  var stack = [];   // [{indent, open}]
  lines.forEach(function(line){
    if (!line.trim()) return;
    var indent = line.match(/^ */)[0].length;
    var body = line.trim().replace(/^[-*]\s*/, "");
    var i = body.indexOf(":");
    var k = i < 0 ? body : body.slice(0, i).trim();
    var v = i < 0 ? "" : body.slice(i + 1).trim();
    while (stack.length && indent <= stack[stack.length - 1]) { h.push('</div>'); stack.pop(); }
    if (v) {
      h.push('<div class="er-kv"><span class="er-k">' + esc(k) + '</span>'
        + '<span class="er-v">' + esc(v) + '</span></div>');
    } else {
      h.push('<div class="er-n"><div class="er-t">' + esc(k) + '</div>');
      stack.push(indent);
    }
  });
  while (stack.length) { h.push('</div>'); stack.pop(); }
  h.push('</div>');
  return h.join('');
}

function stateMachine(t){
  if (!t || !t.states || !t.states.length) return '<p class="empty">（本期无状态机）</p>';
  var st = t.states, rows = t.rows || [];
  var W = 122, H = 46, GX = 76, GY = 104, PL = 30, PT = 58;
  var per = Math.min(3, st.length), nRow = Math.ceil(st.length / per);
  var pos = {};
  st.forEach(function(s, i){
    var row = Math.floor(i / per), col = i % per;
    var inRow = Math.min(per, st.length - row * per);
    var off = (per - inRow) * (W + GX) / 2;
    pos[s] = { x: PL + off + col * (W + GX), y: PT + row * (H + GY), row: row };
  });
  var cols = Math.min(per, st.length);
  var vw = PL * 2 + cols * W + (cols - 1) * GX;
  var vh = PT * 2 + nRow * H + (nRow - 1) * GY + (rows.length ? 10 : 0);

  var h = ['<div class="sm"><svg viewBox="0 0 ' + vw + ' ' + vh + '" role="img" aria-label="状态机">'];
  h.push('<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9FB3C9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D8A24A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');

  // 节点
  st.forEach(function(s){
    var p = pos[s];
    var fill = "#F1F5FA", stroke = "#C3D3E4", tx = "#3D5B7A";
    if (/启用|生效|正常|已通过/.test(s)) { fill = "#EAF7EE"; stroke = "#8FCEA8"; tx = "#1B7F45"; }
    if (/停用|暂停|挂起/.test(s)) { fill = "#FFF6E8"; stroke = "#EBC98D"; tx = "#96601A"; }
    if (/删除|作废|终止|已撤销/.test(s)) { fill = "#FEF1F0"; stroke = "#F0B4AE"; tx = "#A32D2D"; }
    h.push('<rect x="' + p.x + '" y="' + p.y + '" width="' + W + '" height="' + H
      + '" rx="9" fill="' + fill + '" stroke="' + stroke + '"/>');
    h.push('<text x="' + (p.x + W/2) + '" y="' + (p.y + H/2) + '" text-anchor="middle" '
      + 'dominant-baseline="central" font-size="13" font-weight="500" fill="' + tx + '">'
      + esc(s) + '</text>');
  });

  // 连线
  rows.forEach(function(r, i){
    var a = pos[r.from], b = pos[r.to];
    if (!a || !b) return;
    var back = /back|revert|回/.test(r.kind||"");
    var danger = /danger|irreversible/.test(r.kind||"");
    var stroke = back ? "#D8A24A" : (danger ? "#C9553F" : "#9FB3C9");
    var mk = back ? "ahr" : "ah";
    var dash = /draft/.test(r.kind||"") ? ' stroke-dasharray="4 3"' : "";
    var x1, y1, x2, y2, lx, ly, anc = "middle";
    if (a.row === b.row) {
      y1 = a.y + H/2; y2 = b.y + H/2;
      if (b.x > a.x) {
        x1 = a.x + W; x2 = b.x - 3;
        lx = (x1 + x2) / 2; ly = y1 - 9;
        h.push('<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" fill="none" stroke="'
          + stroke + '" stroke-width="1.5"' + dash + ' marker-end="url(#' + mk + ')"/>');
      } else {
        /* 反向：向上绕弧，否则与正向线重合、两个标签落同一点 */
        x1 = a.x; x2 = b.x + W + 3;
        var cx = (x1 + x2) / 2, top = a.y - 34;
        lx = cx; ly = a.y - 9;
        h.push('<path d="M' + x1 + ' ' + y1 + ' C' + cx + ' ' + top + ' ' + cx + ' ' + top
          + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="' + stroke + '" stroke-width="1.5"'
          + dash + ' marker-end="url(#' + mk + ')"/>');
      }
    } else {
      // 跨行：先横后竖再横
      x1 = a.x + W/2; y1 = a.y + (b.row > a.row ? H : 0);
      x2 = b.x + W/2; y2 = b.y + (b.row > a.row ? 0 : H);
      var my = (y1 + y2) / 2;
      h.push('<path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my
        + ' ' + x2 + ' ' + (y2 + (b.row > a.row ? -3 : 3)) + '" fill="none" stroke="'
        + stroke + '" stroke-width="1.5"' + dash + ' marker-end="url(#' + mk + ')"/>');
      /* 两类跨行边：近垂直 → 标签放线右侧；斜线 → 标签放中点右上方，都不压线 */
      if (Math.abs(x1 - x2) < 6) {
        lx = x1 + 9; ly = my; anc = "start";
        if (x1 > vw * 0.45) { lx = x1 - 9; anc = "end"; }   /* 靠右的竖线，标签放左侧，避开相邻标签 */
      } else {
        /* 斜线：标签放线的外侧（向右下走→放左上；向左下走→放右上） */
        if (x2 > x1) { lx = (x1 + x2) / 2 - 6; ly = my - 3; anc = "end"; }
        else { lx = (x1 + x2) / 2 + 9; ly = my - 3; anc = "start"; }
      }
    }
    if (r.label) {
      var lcolor = back ? "#96601A" : (danger ? "#B3261E" : "#6E8298");
      h.push('<text class="lb" x="' + lx + '" y="' + ly + '" text-anchor="' + anc + '" font-size="10.5" fill="'
        + lcolor + '">' + esc(r.label) + '</text>');
    }
  });
  h.push('</svg>');
  if (t.caption) h.push('<div class="smcap">' + raw(t.caption) + '</div>');
  h.push('</div>');

  // 迁移表
  if (rows.length) {
    h.push('<div class="tw"><table><tr><th style="width:42px">ID</th><th style="width:120px">从 → 到</th>'
      + '<th style="width:130px">触发</th><th>条件 / 后效</th></tr>');
    rows.forEach(function(r){
      // id 是跨模块引用的落点：正文/报告里写「T17」时要能跳过来（rid 只在模块内唯一）
      h.push('<tr id="tr-' + esc(r.id) + '"><td class="mono">' + esc(r.id) + '</td><td class="mono">' + esc(r.from)
        + ' → ' + esc(r.to) + '</td><td>' + raw(r.trigger||"—") + '</td><td>'
        + raw(r.guard||"—") + '</td></tr>');
    });
    h.push('</table></div>');
  }
  if (t.confidence) h.push('<p class="callout warn"><b>这张状态机的置信度：' + esc(t.confidence) + '</b> '
    + raw(t.note||"") + '</p>');
  return h.join('');
}

function strip(s){
  // 先还原实体再剥标签：合并版里数据经过两层转义，直接剥标签会留下 &lt;b&gt; 字面量，
  // AI 视图里看着像语法错误，实际是没解干净。
  var t = String(s==null?"":s)
    .replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
  return t.replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();

/* ---------- 帧高度 ----------
   两条都会让底部内容被 overflow:hidden 切掉：
   ① 弹窗/抽屉是 position:absolute，不进 scrollHeight，只按 scrollHeight 算就漏了它们；
   ② 首帧测量常早于字体就位，字体一换行高就变，量好的高度又短了。 */
function overlayBottom(px){
  var bottom = 0;
  Array.prototype.forEach.call(px.querySelectorAll(".px-modal,.px-dlg,.px-drawer"), function(el){
    if (!el.offsetHeight) return;
    var y = 0, n = el;
    while (n && n !== px) { y += n.offsetTop; n = n.offsetParent; }
    if (!n) return;                       // 不属于这一帧
    bottom = Math.max(bottom, y + el.offsetHeight);
  });
  return bottom;
}
function frameNeedH(px){
  /* .px 有 min-height:100%，长内容会自己撑高；浮层再单独取一次最低点。
     不加额外 padding —— 遮罩的 inset:0 会跟着画布长，加了就每渲染一次长一点。 */
  return Math.max(PROTO.vh, Math.ceil(px.offsetHeight || 0), Math.ceil(overlayBottom(px)));
}
function fitFrameH(fr, px){
  if (!fr || !px) return 0;
  var need = frameNeedH(px);
  if (Math.abs((parseInt(fr.style.height, 10) || 0) - need) > 1) fr.style.height = need + "px";
  return need;
}
/* 字体与图片落定后再量一次：首帧量早了，字一换行就露馅 */
function settleFrame(fr, px){
  if (!fr || !px) return;
  function again(){
    if (!fr.isConnected) return;
    fitFrameH(fr, px);
    fitProto();
    reportClips();
  }
  requestAnimationFrame(function(){ requestAnimationFrame(again); });
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(again).catch(function(){});
  }
  var left = 0;
  Array.prototype.forEach.call(px.querySelectorAll("img"), function(im){
    if (im.complete) return;
    left++;
    var f = function(){ im.removeEventListener("load", f); im.removeEventListener("error", f); if (--left <= 0) again(); };
    im.addEventListener("load", f);
    im.addEventListener("error", f);
  });
  setTimeout(again, 900);                 // 兜底：图片挂了/字体永不 ready 也停不下来
}

/* ---------- 裁切自检 ----------
   「底部按钮只截了一半」这类问题，肉眼要逐帧盯才看得出来，但几何上很好判：
   凡 overflow:hidden 的盒子，内容比盒子高/宽就是被切了。折进 fit 流程里跑，
   产物的 body[data-clip] 直接给出结果，shot_verify 不用再另写一套判断。 */
function clipScan(){
  var wrap = document.getElementById("pwrap"), out = [];
  if (!wrap) return out;
  Array.prototype.forEach.call(
    wrap.querySelectorAll(".px,.px-modal,.px-dlg,.px-drawer,.px-card,.px-main,.px-body,.px-cell"), function(el){
      var st = getComputedStyle(el);
      if (st.overflowY !== "hidden" && st.overflow !== "hidden") return;
      var dy = el.scrollHeight - el.clientHeight;
      var dx = el.scrollWidth - el.clientWidth;
      if (dy <= 2 && dx <= 2) return;
      out.push({
        cls: (el.className || "").split(" ")[0],
        axis: dy > 2 ? "竖向" : "横向",
        over: dy > 2 ? dy : dx,
        text: (el.textContent || "").replace(/\s+/g, " ").trim().slice(0, 22)
      });
    });
  return out;
}
function reportClips(){
  var c = clipScan();
  document.body.setAttribute("data-clip", c.length ? "1" : "0");
  window.__clipDetail = c;
  if (c.length && window.console) {
    console.warn("[PRD] 有 " + c.length + " 处内容被 overflow:hidden 裁掉", c);
  }
  return c;
}
window.clipScan = clipScan;

function showFrame(i){
  var f = PROTO.frames[i];
  if (!f) return;
  PROTO.cur = i;
  Array.prototype.forEach.call(document.querySelectorAll(".ptab"), function(b, j){
    b.classList.toggle("on", j === i);
  });
  var wrap = document.getElementById("pwrap");
  wrap.innerHTML = '<div class="pframe" style="width:' + PROTO.vw + 'px">'
    + (f.html || "") + '</div>';
  // 详情页比设计稿长得多，画布按内容撑开；否则长页面会被裁掉
  var fr = wrap.firstElementChild, px = fr && fr.firstElementChild;
  if (px) {
    fitFrameH(fr, px);
    settleFrame(fr, px);      // 字体/图片到位后再量一次，首帧常常量早了
  }
  var hd = PROTO.frames.length + " 个页面态 · 当前 " + f.id + " " + f.name
    + (f.state ? " · " + f.state : "");
  document.getElementById("protoHd").textContent = hd;
  /* 路由不进可见说明（读者是业务方），只留作页签 title 的提示，研发悬停能看到 */
  document.getElementById("pnote").innerHTML = (f.note ? raw(f.note) : "");
  paintCols();
  markDraft();
  linkChgBack();          // 叙事里的改动块要挂「回原型」；doc 已经渲染完才轮到 showFrame
  fillPChg();
  fitProto();
  if (PROTO.ro) PROTO.ro.disconnect();
  if (window.ResizeObserver) {
    PROTO.ro = new ResizeObserver(function(){ fitProto(); });
    var inner = wrap.firstElementChild;
    if (inner) PROTO.ro.observe(inner);
  }
}

/* 列级改动着色：th 标了 chg-col + data-chg 之后，把同一列的 td 也染上。
   只标表头的话，列身还是白的，缩到 40% 时几乎看不出这一列被改过——
   而业务方判断「有没有标」正是看缩放后的整列观感。 */
function paintCols(){
  var wrap = document.getElementById("pwrap");
  if (!wrap) return;
  Array.prototype.forEach.call(wrap.querySelectorAll("th.chg-col"), function(th){
    var tbl = th.closest("table");
    if (!tbl) return;
    var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
    if (idx < 0) return;
    Array.prototype.forEach.call(tbl.querySelectorAll("tr"), function(tr){
      var c = tr.children[idx];
      if (c && c !== th && c.tagName === "TD") c.classList.add("chg-col");
    });
  });
}

/* 帧级改动条：从当前帧的标注里读出「这一帧改了哪几处」，
   放在画布上方（不随原型缩放），保证任何缩放下都能一眼看到 */
function fillPChg(){
  var box = document.getElementById("pchg");
  if (!box) return;
  var wrap = document.getElementById("pwrap");
  if (!wrap) { box.className = "pchg"; box.innerHTML = ""; return; }
  var seen = {}, out = [];
  function add(code, label, wip, draft){
    if (!code || seen[code]) return;
    seen[code] = 1;
    out.push({c: code, t: label || "", w: !!wip, d: parseInt(draft, 10) || 0});
  }
  // ① 块级：粉块 / 待定块
  Array.prototype.forEach.call(wrap.querySelectorAll(".px-chg[data-chg],.px-wip[data-chg]"), function(el){
    var bd = el.querySelector(".px-chg-bd,.px-wip-bd");
    var t = bd ? bd.textContent.trim() : "";
    var code = el.getAttribute("data-chg");
    var wip = el.classList.contains("px-wip");
    // 徽标文字通常是「改⑩ 打款信息：补支付协议」，拆成编号 + 说明
    var m = t.match(/^(改[①-⑳0-9]+|新增|删[除]?)\s*[·：]?\s*(.*)$/);
    add(code, m ? (m[2] || m[1]) : (t || code), wip, el.getAttribute("data-draft"));
  });
  // ② 列级：表头上的改动列。一个 th 上可能叠着好几个徽标（同一列被改过多稿），
  // 每个徽标都是独立的一条改动，要分别进改动条；列名要把徽标全剥掉再取，
  // 否则会取成「改⑱打款账户和币种账户」这种半截文字。
  Array.prototype.forEach.call(wrap.querySelectorAll("th.chg-col"), function(th){
    var copy = th.cloneNode(true);
    Array.prototype.forEach.call(copy.querySelectorAll(".chg-flag"), function(x){
      if (x.parentNode) x.parentNode.removeChild(x);
    });
    var name = (copy.textContent || "").replace(/\s+/g, " ").trim();
    Array.prototype.forEach.call(th.querySelectorAll(".chg-flag[data-chg]"), function(fl){
      add(fl.getAttribute("data-chg"), name + " 列", false, fl.getAttribute("data-draft"));
    });
    if (th.getAttribute("data-chg")) {
      add(th.getAttribute("data-chg"), name + " 列", false, th.getAttribute("data-draft"));
    }
  });
  // ③ 其余带标注的元素：单元格（td.chg-col）之类。
  //    「整表按状态全集铺开」这种改动落在说明条上，前两轮都扫不到，
  //    改动条上就消失了——读者会以为这一帧没改。取不到徽标就取正文前 22 字。
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-chg]"), function(el){
    var code = el.getAttribute("data-chg");
    if (!code || seen[code]) return;
    if (el.classList.contains("px-chg-bd") || el.classList.contains("chg-flag")
        || el.classList.contains("dchg-bd")) return;
    var host = el.closest(".px-chg,.px-wip");
    if (host && host !== el) return;         // 块内的子元素，已由 ① 记过
    // 取说明条的首句或加粗小标题，别把整段前 22 字硬切（会切在「看全 8」这种半句上）
    var lead = el.querySelector("b");
    var txt = lead ? lead.textContent : (el.textContent || "").split("：")[0];
    txt = (txt || "").replace(/\s+/g, " ").trim().slice(0, 26);
    add(code, txt || code, el.classList.contains("px-wip"), el.getAttribute("data-draft"));
  });

  if (!out.length) { box.className = "pchg"; box.innerHTML = ""; return; }
  box.className = "pchg on";

  // 一条平铺：改动只相对于 4.9 基线，不区分本稿 / 前稿。
  function chip(o){
    var t = (o.t || "").replace(/^(改[①-⑳0-9]+|新增|删除?)\s*[·：]?\s*/, "");
    return '<a class="chg-jump' + (o.w ? " wip" : "") + '" data-chg="' + o.c + '">'
         + '<b>' + esc(o.c) + '</b>' + esc(t) + '</a>';
  }
  box.innerHTML = '<span class="pk">本帧改动 ' + out.length + '</span>'
                + out.map(chip).join("");
}

function fitProto(){
  var wrap = document.getElementById("pwrap");
  var bounds = document.getElementById("pbounds");
  var sc = document.getElementById("pscroll");
  if (!wrap || !bounds || !sc) return;
  var inner = wrap.firstElementChild;
  if (!inner) { bounds.style.width = "0"; bounds.style.height = "0"; return; }
  var avail = sc.clientWidth - 24;                  // pscroll 左右 padding 各 12
  var s = Math.min(1, avail / PROTO.vw);
  if (s < 0.18) s = 0.18;
  wrap.style.transform = "scale(" + s + ")";
  bounds.style.width = Math.round(PROTO.vw * s) + "px";
  // 长页面：占位高度要跟着真实内容走，否则滚动区只到 PROTO.vh，下面的内容永远看不见——
  // 这也是有人把一页拆成好几帧的真实原因。offsetHeight 是未缩放高度，不受 transform 影响。
  var realH = Math.round(inner.offsetHeight || PROTO.vh);
  bounds.style.height = Math.round(Math.max(PROTO.vh, realH) * s) + "px";
  document.getElementById("protoZoom").textContent =
    (s >= 1 ? "原始尺寸 100%" : "缩小 " + Math.round(s * 100) + "%")
    + "  ·  " + PROTO.vw + "×" + realH
    + (realH > PROTO.vh ? "（长页面，整页已画完）" : "");
}

/* ================= ④ 核查：五源事实清单 ================= */
var FCLS = {
  fix     : ["需改", "#C62828", "PRD 现有写法与事实不符，必须改"],
  add     : ["缺失", "#1565C0", "页面 / 代码 / 用例里有，PRD 完全没有"],
  conflict: ["冲突", "#B45309", "两个来源说法不一致，需裁定以谁为准"],
  risk    : ["风险", "#6B46C1", "实现层面的缺陷或缺口，不一定是文档问题"],
  ask     : ["待确认", "#0F766E", "判断不了，必须业务方回答"],
  ok      : ["一致", "#1B7F45", "核过，现有写法正确，不用动"]
};
var FCLS_ORDER = ["fix", "add", "conflict", "risk", "ask", "ok"];

function sourcesBlock(){
  var ss = D.sources || [];

  var h = ['<div class="evm"><div class="evm-h">证据来源<em>只写真的核过的；拿不到就标未核，不假装</em></div>'

    h.push('<div class="ev"><span class="ev-k">' + esc(s.name) + '</span>'
      + '<b class="' + (ok ? "ev-ok" : "ev-part") + '">' + esc(s.status||"—") + '</b>'
      + '<span class="ev-d">' + esc(s.detail||"") + '</span></div>');
  });
  h.push('</div></div>');

}

function renderFacts(){
  var fs = D.facts || [];
  var box = document.getElementById("fxBody");
  var nf = document.getElementById("nFact");
  if (nf) nf.textContent = fs.length ? fs.length : "";

  if (!fs.length) {
    box.innerHTML = '<div class="px-empty" style="background:#fff;border:1px dashed #D6E2F0;'
