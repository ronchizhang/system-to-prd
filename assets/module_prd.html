/* 只看本稿：跨帧、跨模块保持。切页面态时 #pwrap 被整体替换，
   所以状态放在 body 上，而不是某个具体元素上。 */
function toggleOnlyCur(){
  ONLYCUR = !ONLYCUR;
  document.body.classList.toggle("onlycur", ONLYCUR);
  Array.prototype.forEach.call(document.querySelectorAll(".ocbtn"), function(b){
    b.classList.toggle("on", ONLYCUR);
    b.textContent = ONLYCUR ? "看全部稿次" : "只看本稿";
  });
  fillPChg();
}

function fitProto(){
  var wrap = document.getElementById("pwrap");
  var bounds = document.getElementById("pbounds");
  var sc = document.getElementById("pscroll");
  if (!wrap || !bounds || !sc) return;
  var inner = wrap.firstElementChild;
  if (!inner) { bounds.style.width = "0"; bounds.style.height = "0"; return; }
  var avail = sc.clientWidth - 24;                  // pscroll 左右 padding 各 12
  var s = Math.min(1, avail / PROTO.vw);
  if (s < 0.18) s = 0.18;
  wrap.style.transform = "scale(" + s + ")";
  bounds.style.width = Math.round(PROTO.vw * s) + "px";
  // 长页面：占位高度要跟着真实内容走，否则滚动区只到 PROTO.vh，下面的内容永远看不见——
  // 这也是有人把一页拆成好几帧的真实原因。offsetHeight 是未缩放高度，不受 transform 影响。
  var realH = Math.round(inner.offsetHeight || PROTO.vh);
  bounds.style.height = Math.round(Math.max(PROTO.vh, realH) * s) + "px";
  document.getElementById("protoZoom").textContent =
    (s >= 1 ? "原始尺寸 100%" : "缩小 " + Math.round(s * 100) + "%")
    + "  ·  " + PROTO.vw + "×" + realH
    + (realH > PROTO.vh ? "（长页面，整页已画完）" : "");
}

/* ================= ④ 核查：五源事实清单 ================= */
var FCLS = {
  fix     : ["需改", "#C62828", "PRD 现有写法与事实不符，必须改"],
  add     : ["缺失", "#1565C0", "页面 / 代码 / 用例里有，PRD 完全没有"],
  conflict: ["冲突", "#B45309", "两个来源说法不一致，需裁定以谁为准"],
  risk    : ["风险", "#6B46C1", "实现层面的缺陷或缺口，不一定是文档问题"],
  ask     : ["待确认", "#0F766E", "判断不了，必须业务方回答"],
  ok      : ["一致", "#1B7F45", "核过，现有写法正确，不用动"]
};
var FCLS_ORDER = ["fix", "add", "conflict", "risk", "ask", "ok"];

function sourcesBlock(){
  var ss = D.sources || [];
  if (!ss.length) return '';
  var h = ['<div class="evm"><div class="evm-h">证据来源<em>只写真的核过的；拿不到就标未核，不假装</em></div>'
    + '<div class="evm-list">'];
  ss.forEach(function(s){
    var ok = /已核/.test(s.status||"");
    h.push('<div class="ev"><span class="ev-k">' + esc(s.name) + '</span>'
      + '<b class="' + (ok ? "ev-ok" : "ev-part") + '">' + esc(s.status||"—") + '</b>'
      + '<span class="ev-d">' + esc(s.detail||"") + '</span></div>');
  });
  h.push('</div></div>');
  return h.join('');
}

function renderFacts(){
  var fs = D.facts || [];
  var box = document.getElementById("fxBody");
  var nf = document.getElementById("nFact");
  if (nf) nf.textContent = fs.length ? fs.length : "";

  if (!fs.length) {
    box.innerHTML = '<div class="px-empty" style="background:#fff;border:1px dashed #D6E2F0;'
      + 'border-radius:10px;padding:60px 20px">本模块未附核查清单<br>'
      + '<span style="font-size:11.5px">数据里 facts 为空 —— 没有这张清单，正文的每条结论都追不到来源</span></div>';
    return;
  }
  var nP0 = fs.filter(function(f){ return f.sev === "P0"; }).length;
  var cnt = {};
  FCLS_ORDER.forEach(function(k){ cnt[k] = fs.filter(function(f){ return f.cls === k; }).length; });

  var h = [sourcesBlock(), '<div class="fx-sum">'];
  h.push('<div class="fs"><div class="n" style="color:#0B2E4E">' + fs.length + '</div>'
    + '<div class="l">全部事实</div></div>');
  h.push('<div class="fs"><div class="n" style="color:#C62828">' + nP0 + '</div>'
    + '<div class="l">P0 必须裁定</div></div>');
  h.push('<div class="fs"><div class="n" style="color:#C62828">' + cnt.fix + '</div>'
    + '<div class="l">需改</div></div>');
  h.push('<div class="fs"><div class="n" style="color:#1565C0">' + cnt.add + '</div>'
    + '<div class="l">缺失</div></div>');
  h.push('<div class="fs"><div class="n" style="color:#0F766E">' + cnt.ask + '</div>'
    + '<div class="l">待确认</div></div>');
  h.push('</div>');

  h.push('<div class="fx-bar">');
  h.push('<button class="chip on" data-f="all">全部 ' + fs.length + '</button>');
  if (nP0) h.push('<button class="chip s0" data-f="P0">P0 ' + nP0 + '</button>');
  FCLS_ORDER.forEach(function(k){
    if (cnt[k]) h.push('<button class="chip" data-f="' + k + '">'
      + FCLS[k][0] + ' ' + cnt[k] + '</button>');
  });
  h.push('<input class="fx-q" id="fxq" placeholder="搜 编号 / 标题 / 字段">');
  h.push('<span class="cnt" id="fxcnt" style="font-size:11px;color:#8CA0B4"></span>');
  h.push('</div>');

  h.push('<div id="fxlist">');
  FCLS_ORDER.forEach(function(k){
    var list = fs.filter(function(f){ return f.cls === k; });
    if (!list.length) return;
    h.push('<div class="fgrp" data-grp="' + k + '">'
      + '<div class="fgt" style="color:' + FCLS[k][1] + '">' + FCLS[k][0]
      + '<u>' + list.length + ' 条</u><span class="gd">' + FCLS[k][2] + '</span></div>');
    list.forEach(function(f){ h.push(factCard(f)); });
    h.push('</div>');
  });
  h.push('</div>');
  box.innerHTML = h.join('');

  bindFacts();
}

function factCard(f){
  var c = FCLS[f.cls] || FCLS.keep;
  var h = ['<div class="fcard" data-cls="' + esc(f.cls) + '" data-sev="' + esc(f.sev)
    + '" data-id="' + esc(f.id) + '" style="--fc:' + c[1] + '">'];
  h.push('<div class="fch"><span class="id">' + esc(f.id) + '</span>'
    + '<span class="ttl">' + raw(f.title) + '</span>'
    + '<span class="area">' + esc(f.area) + '</span><span class="sp"></span>'
    + '<span class="ftag" style="background:' + c[1] + ';color:#fff">' + c[0] + '</span>');
  if (f.sev) h.push('<span class="ftag" style="background:' + c[1] + '14;color:' + c[1]
    + ';border:1px solid ' + c[1] + '33">' + esc(f.sev) + '</span>');
  var sr = (f.src || []).map(function(s){
    var m = SRC_META[s]; if (!m) return '';
    return '<i style="background:' + m[1] + '" title="' + m[0] + '">' + (SRC_SHORT[s] || "?") + '</i>';
  }).join("");
  if (sr) h.push('<span class="fsrclist">' + sr + '</span>');
  h.push('</div>');

  if (f.old) h.push('<div class="frow"><span class="k o">原说法</span>'
    + '<div class="v old">' + raw(f.old) + '</div></div>');
  h.push('<div class="frow"><span class="k n">实际</span>'
    + '<div class="v now">' + raw(f.now) + '</div></div>');
  if (f.note) h.push('<div class="frow"><span class="k p">判断</span>'
    + '<div class="v">' + raw(f.note) + '</div></div>');
  if (f.ask) h.push('<div class="frow"><span class="k q">要你定</span>'
    + '<div class="v"><div class="fask">' + raw(f.ask) + '</div></div></div>');
  if ((f.rules || []).length) h.push('<div class="frel">影响' + f.rules.map(function(r){
    return '<a data-rule="' + esc(r) + '">' + esc(r) + '</a>'; }).join('') + '</div>');
  if (f.evidence) h.push('<details class="fev"><summary>证据原文</summary><p>'
    + raw(f.evidence) + '</p></details>');
  h.push('</div>');
  return h.join('');
}

function bindFacts(){
  var bar = document.querySelector(".fx-bar");
  if (!bar) return;
  Array.prototype.forEach.call(document.querySelectorAll(".fx-bar .chip"), function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".fx-bar .chip").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      filterFacts();
    });
  });
  var q = document.getElementById("fxq");
  if (q) q.addEventListener("input", filterFacts);
  filterFacts();
}

function filterFacts(){
  var on = document.querySelector(".fx-bar .chip.on");
  var cls = on ? on.dataset.f : "all";
  var q = (document.getElementById("fxq") || {}).value || "";
  q = q.trim().toLowerCase();
  var n = 0, total = 0;
  Array.prototype.forEach.call(document.querySelectorAll(".fcard"), function(c){
    total++;
    var hit = (cls === "all" || (cls === "P0" ? c.dataset.sev === "P0" : c.dataset.cls === cls));
    if (hit && q) hit = c.textContent.toLowerCase().indexOf(q) >= 0;
    c.classList.toggle("hide", !hit);
    if (hit) n++;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".fgrp"), function(g){
    var vis = g.querySelectorAll(".fcard:not(.hide)").length;
    g.style.display = vis ? "" : "none";
    var u = g.querySelector("u"); if (u) u.textContent = vis + " 条";
  });
  var c = document.getElementById("fxcnt");
  if (c) c.textContent = n === total ? "" : "显示 " + n + " / " + total;
}

/* ---------- 联动 + 模式 ---------- */
var PANE = {proto:"paneProto", human:"paneHuman", ai:"paneAi", facts:"paneFacts",
            cases:"paneCases", code:"paneCode"};
/* 四栏：文档（原型+叙事并排）/ 测试用例 / 代码逻辑 / 核查。
   原来「原型 / 叙事 / AI 读」三个独立页签收掉了：读者不会为了看一句话来回切三栏，
   而 AI 读本来就是给机器看的，并入代码逻辑栏末尾，需要时再展开。 */
var MODE_SHOW = {both:["proto","human"], proto:["proto"], human:["human"],
                 cases:["cases"], code:["code"], ai:["ai"], facts:["facts"]};
var MODE_TIP = {
  both : ['<b>左原型，右叙事</b>',
          '原型与正文是同一份数据的两种渲染。点规则卡上的 <code>F-xx</code> 跳到核查，点 <code>R-xxx</code> 跳到 AI 读。'],
  proto: ['<b>原型</b>',
          '本模块所有页面态（含弹窗、二级页）都收在这里，按设计尺寸 1:1 渲染后等比缩放；点上方页签换态。'],
  human: ['<b>叙事</b>',
          '给业务、PM、测试、研发读的正文。8 段固定结构，一条规则一张卡，case 挂在规则下面。'],
  cases: ['<b>测试用例</b>',
          '用例库里的条目按功能点归到一处，同一件事不再散在三个文档里。每条标了它守的是哪条规则，'
          + '规则改了就能反查出要重写哪几条用例。'],
  code : ['<b>代码逻辑</b>',
          '上半段是给业务方看的大白话：这个数谁算的、什么时候算、算不出来怎么办。'
          + '下半段才是给研发的对照表（页面 / 组件 / 接口 / 字段），AI 读导出在最末尾。'],
  ai   : ['<b>AI 读</b>',
          '同一份数据的条目化导出。规则一行一条 JSONL，编号与叙事一致，facts 里 settled=false 的禁止写进代码。'],
  facts: ['<b>核查</b>',
          '五源事实清单。每条写清原说法 / 实际 / 判断 / 要你定；正文规则卡的「依据」全部指回这里。']
};

/* 模式用变量记：顶栏只放四栏，但 proto / human 这两个「只看一栏」的模式仍然要能直达
   （?m=human 用来把文档单独打开读，宽屏读长文更舒服）。 */
var CUR_MODE = "both";
function curMode(){ return CUR_MODE || "both"; }

function applyLayout(){
  var m = curMode(), show = MODE_SHOW[m] || ["human"];
  Object.keys(PANE).forEach(function(k){
    var el = document.getElementById(PANE[k]);
    if (el) el.classList.toggle("hide", show.indexOf(k) < 0);
  });
  document.body.classList.toggle("both", m === "both");
  var top = document.querySelector(".top").offsetHeight;
  document.documentElement.style.setProperty("--topH", top + "px");
  var t = MODE_TIP[m] || MODE_TIP.human;
  var r2 = document.getElementById("r2");
  if (r2) r2.innerHTML = t[0] + '<span>' + t[1] + '</span>';
  fitProto();
}

function goMode(m){
  var b = document.querySelector('.modes button[data-m="' + m + '"]');
  if (b) { if (!b.classList.contains("on")) b.click(); return; }
  // 没有对应按钮（proto / human）：直接切，顶栏按钮全部取消选中
  if (MODE_SHOW[m]) {
    document.querySelectorAll(".modes button").forEach(function(x){ x.classList.remove("on"); });
    CUR_MODE = m;
    applyLayout();
  }
}

function flash(el, block){
  if (!el) return;
  el.scrollIntoView({block: block || "center", behavior:"smooth"});
  el.classList.add("hl");
  setTimeout(function(){ el.classList.remove("hl"); }, 2200);
}

function bind(){
  Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".modes button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      CUR_MODE = b.dataset.m;
      applyLayout();
      document.querySelectorAll(".pane-scroll").forEach(function(p){ p.scrollTop = 0; });
    });
  });

  // 原型页签
  document.addEventListener("click", function(e){
    var t = (e.target && e.target.closest) ? e.target.closest("[data-fi]") : null;
    if (t) {
      // 正文里的「回看原型」反链：当前在纯叙事模式下先把原型栏调出来，否则点了没反应
      var pp = document.getElementById("paneProto");
      if (pp && pp.classList.contains("hide")) goMode("both");
      showFrame(parseInt(t.dataset.fi, 10)); return;
    }
  });

  // 统一跳转：规则编号 → AI 读；F-xx → 核查；R-xxx → 叙事；data-goto → 文内锚点
  document.addEventListener("click", function(e){
    if (!e.target || !e.target.closest) return;
    // 文内锚点：原型上的「看变量说明」、正文里的交叉引用都走这条
    // 必须先把叙事栏切出来——纯原型模式下目标是 display:none，scrollIntoView 不动
    var g = e.target.closest("[data-goto]");
    if (g) {
      if (e.preventDefault) e.preventDefault();
      goMode("both");
      var gEl = document.getElementById(g.dataset.goto);
      if (gEl) setTimeout(function(){ flash(gEl, "start"); }, 60);
      return;
    }
    var j = e.target.closest("[data-jump]");
    if (j) {
      goMode("ai");
      flash(document.querySelector('.jline[data-rid="' + j.dataset.jump + '"]'));
      return;
    }
    var f = e.target.closest("[data-fact]");
    if (f) {
      goMode("facts");
      var card = document.querySelector('.fcard[data-id="' + f.dataset.fact + '"]');
      if (card && card.classList.contains("hide")) {
        var all = document.querySelector('.fx-bar .chip[data-f="all"]');
        if (all) all.click();
      }
      flash(card);
      return;
    }
    var r = e.target.closest("[data-rule]");
    if (r) {
      goMode("human");
      flash(document.getElementById("rc-" + r.dataset.rule));
      return;
    }
  });

  window.addEventListener("resize", function(){ applyLayout(); fitProto(); });
}

/* ---------- 启动 ---------- */
document.getElementById("ttl").textContent = (D.meta && D.meta.module) || "模块 PRD";
document.getElementById("crumb").textContent = (D.meta && D.meta.menu) || "";
document.title = ((D.meta && D.meta.module) || "模块 PRD") + " · PRD";
document.getElementById("doc").innerHTML = head() + renderSections();
renderCode();          // 内含 AI 读（已并入代码栏末尾的折叠块）
document.getElementById("aiBody").innerHTML = renderAI();
renderCases();
renderProto();
markDraft();          // 叙事里的改动块也要按稿次分「本稿 / 前稿」
fillChgCase();        // 改动对照卡：改前 / 改后 并排
if (ONLYCUR) document.body.classList.add("onlycur");
renderFacts();
bind();
applyLayout();

/* 支持 ?m=cases / ?m=code / ?m=facts 直达某一栏：发给同事时可以直接指到「看这栏」 */
(function(){
  var m = (location.search.match(/[?&]m=([a-z]+)/) || [])[1];
  if (m && MODE_SHOW[m]) goMode(m);
  // ?chg=C5 直接跳到某一处改动：发链接时可以说「看这处」，不用对方自己找
  var c = (location.search.match(/[?&]chg=(C\d+)/i) || [])[1];
  if (c) setTimeout(function(){ wireTo(c.toUpperCase()); }, 60);
})();

/* ============ 改动标注：点击徽标 → 滚到对应文字 + 拉一条连线 ============ */
/* 连线的意义：粉色块只说明「这里变了」，变了什么写在叙事里。
   两块并排时画条线，读者不用来回找。只在 both 模式下画，其它模式只做高亮跳转。 */
var CHG_CELL = 'data-chg';
function chgNodes(id){
  var out = {px: [], doc: []};
  Array.prototype.forEach.call(document.querySelectorAll('[data-chg="' + id + '"]'), function(el){
    if (el.classList.contains('dchg-bd') || el.classList.contains('px-chg-bd')) return;
    if (el.closest('#paneProto')) out.px.push(el);
    else out.doc.push(el);
  });
  // 列表页的改动是列级：th 带 data-chg，对应整列的 td 也算同一块
  var ths = document.querySelectorAll('#paneProto th[data-chg="' + id + '"]');
  if (ths.length) {
    var table = ths[0].closest('table'), idx = -1;
    Array.prototype.forEach.call(ths[0].parentNode.children, function(c, i){ if (c === ths[0]) idx = i; });
    if (table && idx >= 0) {
      Array.prototype.forEach.call(table.querySelectorAll('tr'), function(tr){
        var c = tr.children[idx];
        if (c && out.px.indexOf(c) < 0) out.px.push(c);
      });
    }
  }
  return out;
}
function wireOff(){
  var svg = document.getElementById('wire');
  if (svg) svg.innerHTML = '';
  Array.prototype.forEach.call(document.querySelectorAll('.wired'), function(e){ e.classList.remove('wired'); });
}
function rel(el){
  var r = el.getBoundingClientRect(), s = document.getElementById('stage').getBoundingClientRect();
  return {l: r.left - s.left, r: r.right - s.left, t: r.top - s.top, b: r.bottom - s.top,
          cy: r.top + r.height / 2 - s.top, h: r.height};
}
/* 只画线、不滚动。滚动时重画用这个，外面那层 scroll 监听才能跟着走而不把线抹掉 */
function paint(id){
  var svg = document.getElementById('wire');
  if (!svg) return;
  svg.innerHTML = '';
  if (!document.body.classList.contains('both')) return;
  var n = chgNodes(id);
  if (!n.px.length || !n.doc.length) return;
  var H = document.getElementById('stage').clientHeight;
  var a = rel(n.px[0]), b = rel(n.doc[0]);
  // 有一头被滚出视口就不画——画一条连到屏幕外的线等于骗人
  if (a.b < 0 || a.t > H || b.b < 0 || b.t > H) return;
  // 从块的右上角附近出发、落到对面块的左上角附近：
  // 走中线会横穿中间的其它卡片，读起来像连错了对象
  var y1 = a.t + Math.min(16, a.h / 2), y2 = b.t + Math.min(16, b.h / 2);
  var x1 = a.r + 2, x2 = b.l - 2;
  var dx = Math.max(40, Math.abs(x2 - x1) * 0.42);
  var d = 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' '
        + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2;
  svg.innerHTML = '<path d="' + d + '"></path>'
    + '<circle cx="' + x1 + '" cy="' + y1 + '" r="3.4"></circle>'
    + '<circle cx="' + x2 + '" cy="' + y2 + '" r="3.4"></circle>';
}
var CUR = null;
/* 从同一编号的多个文档节点里，挑出「该跳过去的那一个」：
   优先级 改动点正文块(.dchg) > 附录/说明块 > 其它，索引里的小标签(.chg-jump)永远不选。 */
function pickDocTarget(list){
  if (!list || !list.length) return null;
  var tiers = [
    function(e){ return e.classList.contains('dchg'); },
    function(e){ return e.closest('.spc') || e.classList.contains('spc'); },
    function(e){ return !e.classList.contains('chg-jump'); }
  ];
  for (var i = 0; i < tiers.length; i++) {
    for (var j = 0; j < list.length; j++) if (tiers[i](list[j])) return list[j];
  }
  return null;
}

/* 落点提示：滚到之后闪一下边框，读者才知道「跳的是这一块」而不是「页面自己滚了」 */
function landOn(el){
  if (!el) return;
  el.classList.remove('landed');
  void el.offsetWidth;          // 强制重排，让动画能重播
  el.classList.add('landed');
  clearTimeout(el._landT);
  el._landT = setTimeout(function(){ el.classList.remove('landed'); }, 1600);
}

function wireTo(id, keep){
  // 只看原型时右栏是藏着的，点了标注看不到任何变化——自动切回双栏，
  // 因为「点标注」这个动作本身就说明想看说明
  var hp = document.getElementById("paneHuman");
  if (hp && hp.classList.contains("hide")) goMode("both");
  if (id !== CUR || !keep) wireOff();
  CUR = id;
  var n = chgNodes(id);
  if (!n.px.length || !n.doc.length) {
    // 只有一头存在（改③ 这种纯规则改动，页面上没有对应块）：只高亮能高亮的那头
    (n.doc.length ? n.doc : n.px).forEach(function(e){ e.classList.add('wired'); });
    var box = document.getElementById('cc-' + id) || pickDocTarget(n.doc) || n.doc[0] || n.px[0];
    if (box) { box.scrollIntoView({block: 'center', behavior: 'auto'}); landOn(box); }
    markCase(id);
    return;
  }
  // 滚动目标要挑「改动点正文块」，不能拿文档最上面索引里的那颗小标签——
  // 它们带同一个 data-chg，取 doc[0] 就会滚到文档最顶端（2026-11-03 业务方指出）
  var docTarget = pickDocTarget(n.doc);
  var pxEl = n.px[0];
  // 有「改前/改后」对照卡时优先滚到卡：读者点改动，要的是「原来长什么样」，
  // 正文块说的还是改后的事，答不了这一问。
  var docEl = document.getElementById('cc-' + id) || docTarget || n.doc[0];
  pxEl.scrollIntoView({block: 'center', behavior: 'auto'});
  if (docEl) docEl.scrollIntoView({block: 'center', behavior: 'auto'});
  n.px.forEach(function(e){ e.classList.add('wired'); });
  n.doc.forEach(function(e){ e.classList.add('wired'); });
  if (docEl) landOn(docEl);
  markCase(id);
  paint(id);
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-chg]');
  if (!b) return;
  var id = b.getAttribute('data-chg');
  if (!id) return;
  // 原型里点粉块任意位置都算（块就是标记本体）；
  // 叙事里只有小徽标可点，否则读文字时一碰就滚走。
  var isBadge = b.classList.contains('px-chg-bd') || b.classList.contains('dchg-bd')
             || b.classList.contains('chg-jump');
  if (!isBadge && !b.closest('#paneProto')) return;
  e.preventDefault();
  wireTo(id);
}, true);
// 面板滚动后线会错位：跟着重画，而不是抹掉——否则读者一滚就没了
function repaint(){ if (CUR) paint(CUR); }
window.addEventListener('resize', repaint);
var _ps = document.getElementById('pscroll');
if (_ps) _ps.addEventListener('scroll', repaint, {passive: true});
var _hs = document.querySelector('#paneHuman .pane-scroll');
if (_hs) _hs.addEventListener('scroll', repaint, {passive: true});

</script>
